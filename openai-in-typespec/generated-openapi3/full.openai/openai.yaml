        modalities:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeModality'
          description: |-
            The set of modalities the model can respond with. To disable audio,
            set this to ["text"].
        instructions:
          type: string
          description: |-
            The default system instructions (i.e. system message) prepended to model 
            calls. This field allows the client to guide the model on desired 
            responses. The model can be instructed on response content and format, 
            (e.g. "be extremely succinct", "act friendly", "here are examples of good 
            responses") and on audio behavior (e.g. "talk quickly", "inject emotion 
            into your voice", "laugh frequently"). The instructions are not guaranteed 
            to be followed by the model, but they provide guidance to the model on the 
            desired behavior.

            Note that the server sets default instructions which will be used if this 
            field is not set and are visible in the `session.created` event at the 
            start of the session.
        voice:
          allOf:
            - $ref: '#/components/schemas/VoiceIdsShared'
          description: |-
            The voice the model uses to respond. Voice cannot be changed during the 
            session once the model has responded with audio at least once. Current 
            voice options are `alloy`, `ash`, `ballad`, `coral`, `echo` `sage`, 
            `shimmer` and `verse`.
        input_audio_format:
          allOf:
            - $ref: '#/components/schemas/RealtimeAudioFormat'
          description: The format of input audio. Options are `pcm16`, `g711_ulaw`, or `g711_alaw`.
        output_audio_format:
          allOf:
            - $ref: '#/components/schemas/RealtimeAudioFormat'
          description: The format of output audio. Options are `pcm16`, `g711_ulaw`, or `g711_alaw`.
        input_audio_transcription:
          type: object
          properties:
            model:
              type: string
              description: |-
                The model to use for transcription, `whisper-1` is the only currently 
                supported model.
          description: |-
            Configuration for input audio transcription, defaults to off and can be 
            set to `null` to turn off once on. Input audio transcription is not native 
            to the model, since the model consumes audio directly. Transcription runs 
            asynchronously through Whisper and should be treated as rough guidance 
            rather than the representation understood by the model.
        turn_detection:
          type: object
          properties:
            type:
              type: string
              description: Type of turn detection, only `server_vad` is currently supported.
            threshold:
              type: number
              format: float
              description: |-
                Activation threshold for VAD (0.0 to 1.0), this defaults to 0.5. A
                higher threshold will require louder audio to activate the model, and
                thus might perform better in noisy environments.
            prefix_padding_ms:
              type: integer
              format: int32
              description: |-
                Amount of audio to include before the VAD detected speech (in
                milliseconds). Defaults to 300ms.
            silence_duration_ms:
              type: integer
              format: int32
              description: |-
                Duration of silence to detect speech stop (in milliseconds). Defaults
                to 500ms. With shorter values the model will respond more quickly,
                but may jump in on short pauses from the user.
          description: |-
            Configuration for turn detection. Can be set to `null` to turn off. Server 
            VAD means that the model will detect the start and end of speech based on 
            audio volume and respond at the end of user speech.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeTool'
          description: Tools (functions) available to the model.
        tool_choice:
          type: string
          description: |-
            How the model chooses tools. Options are `auto`, `none`, `required`, or 
            specify a function.
        temperature:
          type: number
          format: float
          description: Sampling temperature for the model, limited to [0.6, 1.2]. Defaults to 0.8.
        max_response_output_tokens:
          anyOf:
            - type: integer
              format: int32
            - type: string
              enum:
                - inf
          description: |-
            Maximum number of output tokens for a single assistant response,
            inclusive of tool calls. Provide an integer between 1 and 4096 to
            limit output tokens, or `inf` for the maximum available tokens for a
            given model. Defaults to `inf`.
      description: |-
        A new Realtime session configuration, with an ephermeral key. Default TTL
        for keys is one minute.
    RealtimeTool:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/RealtimeToolType'
      discriminator:
        propertyName: type
        mapping:
          function: '#/components/schemas/RealtimeFunctionTool'
      description: The base representation of a realtime tool definition.
    RealtimeToolChoice:
      anyOf:
        - $ref: '#/components/schemas/RealtimeToolChoiceLiteral'
        - $ref: '#/components/schemas/RealtimeToolChoiceObject'
      description: |-
        The combined set of available representations for a realtime tool_choice parameter, encompassing both string
        literal options like 'auto' as well as structured references to defined tools.
    RealtimeToolChoiceFunctionObject:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          enum:
            - function
        function:
          type: object
          properties:
            name:
              type: string
          required:
            - name
      allOf:
        - $ref: '#/components/schemas/RealtimeToolChoiceObject'
      description: The representation of a realtime tool_choice selecting a named function tool.
    RealtimeToolChoiceLiteral:
      anyOf:
        - type: string
        - type: string
          enum:
            - auto
            - none
            - required
      description: The available set of mode-level, string literal tool_choice options for the realtime endpoint.
    RealtimeToolChoiceObject:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/RealtimeToolType'
      discriminator:
        propertyName: type
        mapping:
          function: '#/components/schemas/RealtimeToolChoiceFunctionObject'
      description: A base representation for a realtime tool_choice selecting a named tool.
    RealtimeToolType:
      anyOf:
        - type: string
        - type: string
          enum:
            - function
      description: |-
        The supported tool type discriminators for realtime tools.
        Currently, only 'function' tools are supported.
    RealtimeTranscriptionSessionCreateRequest:
      type: object
      properties:
        modalities:
          type: array
          items:
            type: string
            enum:
              - text
              - audio
          description: |-
            The set of modalities the model can respond with. To disable audio,
            set this to ["text"].
        input_audio_format:
          type: string
          enum:
            - pcm16
            - g711_ulaw
            - g711_alaw
          description: |-
            The format of input audio. Options are `pcm16`, `g711_ulaw`, or `g711_alaw`.
            For `pcm16`, input audio must be 16-bit PCM at a 24kHz sample rate, 
            single channel (mono), and little-endian byte order.
          default: pcm16
        input_audio_transcription:
          type: object
          properties:
            model:
              type: string
              enum:
                - gpt-4o-transcribe
                - gpt-4o-mini-transcribe
                - whisper-1
              description: The model to use for transcription, current options are `gpt-4o-transcribe`, `gpt-4o-mini-transcribe`, and `whisper-1`.
            language:
              type: string
              description: |-
                The language of the input audio. Supplying the input language in
                [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) (e.g. `en`) format
                will improve accuracy and latency.
            prompt:
              type: string
              description: |-
                An optional text to guide the model's style or continue a previous audio
                segment.
                For `whisper-1`, the [prompt is a list of keywords](/docs/guides/speech-to-text#prompting).
                For `gpt-4o-transcribe` models, the prompt is a free text string, for example "expect words related to technology".
          description: Configuration for input audio transcription. The client can optionally set the language and prompt for transcription, these offer additional guidance to the transcription service.
        turn_detection:
          type: object
          properties:
            type:
              type: string
              enum:
                - server_vad
                - semantic_vad
              description: Type of turn detection.
              default: server_vad
            eagerness:
              type: string
              enum:
                - low
                - medium
                - high
                - auto
              description: Used only for `semantic_vad` mode. The eagerness of the model to respond. `low` will wait longer for the user to continue speaking, `high` will respond more quickly. `auto` is the default and is equivalent to `medium`.
              default: auto
            threshold:
              type: number
              format: float
              description: |-
                Used only for `server_vad` mode. Activation threshold for VAD (0.0 to 1.0), this defaults to 0.5. A 
                higher threshold will require louder audio to activate the model, and 
                thus might perform better in noisy environments.
            prefix_padding_ms:
              type: integer
              format: int32
              description: |-
                Used only for `server_vad` mode. Amount of audio to include before the VAD detected speech (in 
                milliseconds). Defaults to 300ms.
            silence_duration_ms:
              type: integer
              format: int32
              description: |-
                Used only for `server_vad` mode. Duration of silence to detect speech stop (in milliseconds). Defaults 
                to 500ms. With shorter values the model will respond more quickly, 
                but may jump in on short pauses from the user.
            create_response:
              type: boolean
              description: Whether or not to automatically generate a response when a VAD stop event occurs. Not available for transcription sessions.
              default: true
            interrupt_response:
              type: boolean
              description: |-
                Whether or not to automatically interrupt any ongoing response with output to the default
                conversation (i.e. `conversation` of `auto`) when a VAD start event occurs. Not available for transcription sessions.
              default: true
          description: |-
            Configuration for turn detection, ether Server VAD or Semantic VAD. This can be set to `null` to turn off, in which case the client must manually trigger model response.
            Server VAD means that the model will detect the start and end of speech based on audio volume and respond at the end of user speech.
            Semantic VAD is more advanced and uses a turn detection model (in conjuction with VAD) to semantically estimate whether the user has finished speaking, then dynamically sets a timeout based on this probability. For example, if user audio trails off with "uhhm", the model will score a low probability of turn end and wait longer for the user to continue speaking. This can be useful for more natural conversations, but may have a higher latency.
        input_audio_noise_reduction:
          type: object
          properties:
            type:
              type: string
              enum:
                - near_field
                - far_field
              description: Type of noise reduction. `near_field` is for close-talking microphones such as headphones, `far_field` is for far-field microphones such as laptop or conference room microphones.
          nullable: true
          description: |-
            Configuration for input audio noise reduction. This can be set to `null` to turn off.
            Noise reduction filters audio added to the input audio buffer before it is sent to VAD and the model.
            Filtering the audio can improve VAD and turn detection accuracy (reducing false positives) and model performance by improving perception of the input audio.
          default: null
        include:
          type: array
          items:
            type: string
          description: |-
            The set of items to include in the transcription. Current available items are:
            - `item.input_audio_transcription.logprobs`
      description: Realtime transcription session object configuration.
    RealtimeTranscriptionSessionCreateResponse:
      type: object
      required:
        - client_secret
      properties:
        client_secret:
          type: object
          properties:
            value:
              type: string
              description: |-
                Ephemeral key usable in client environments to authenticate connections
                to the Realtime API. Use this in client-side environments rather than
                a standard API token, which should only be used server-side.
            expires_at:
              type: integer
              format: unixtime
              description: |-
                Timestamp for when the token expires. Currently, all tokens expire
                after one minute.
          required:
            - value
            - expires_at
          description: |-
            Ephemeral key returned by the API. Only present when the session is
            created on the server via REST API.
        modalities:
          type: array
          items:
            type: string
            enum:
              - text
              - audio
          description: |-
            The set of modalities the model can respond with. To disable audio,
            set this to ["text"].
        input_audio_format:
          type: string
          description: The format of input audio. Options are `pcm16`, `g711_ulaw`, or `g711_alaw`.
        input_audio_transcription:
          type: object
          properties:
            model:
              type: string
              enum:
                - gpt-4o-transcribe
                - gpt-4o-mini-transcribe
                - whisper-1
              description: The model to use for transcription. Can be `gpt-4o-transcribe`, `gpt-4o-mini-transcribe`, or `whisper-1`.
            language:
              type: string
              description: |-
                The language of the input audio. Supplying the input language in
                [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) (e.g. `en`) format
                will improve accuracy and latency.
            prompt:
              type: string
              description: |-
                An optional text to guide the model's style or continue a previous audio
                segment. The [prompt](/docs/guides/speech-to-text#prompting) should match
                the audio language.
          description: Configuration of the transcription model.
        turn_detection:
          type: object
          properties:
            type:
              type: string
              description: Type of turn detection, only `server_vad` is currently supported.
            threshold:
              type: number
              format: float
              description: |-
                Activation threshold for VAD (0.0 to 1.0), this defaults to 0.5. A
                higher threshold will require louder audio to activate the model, and
                thus might perform better in noisy environments.
            prefix_padding_ms:
              type: integer
              format: int32
              description: |-
                Amount of audio to include before the VAD detected speech (in
                milliseconds). Defaults to 300ms.
            silence_duration_ms:
              type: integer
              format: int32
              description: |-
                Duration of silence to detect speech stop (in milliseconds). Defaults
                to 500ms. With shorter values the model will respond more quickly,
                but may jump in on short pauses from the user.
          description: |-
            Configuration for turn detection. Can be set to `null` to turn off. Server 
            VAD means that the model will detect the start and end of speech based on 
            audio volume and respond at the end of user speech.
      description: |-
        A new Realtime transcription session configuration.

        When a session is created on the server via REST API, the session object
        also contains an ephemeral key. Default TTL for keys is one minute. This
        property is not present when a session is updated via the WebSocket API.
    RealtimeTurnDetection:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/RealtimeTurnDetectionType'
        create_response:
          type: boolean
          description: Whether or not to automatically generate a response when VAD is enabled. true by default.
          default: true
        interrupt_response:
          type: boolean
          description: Whether or not to automatically interrupt any ongoing response with output to the default conversation (i.e. `conversation` of `auto`) when a VAD start event occurs.
          default: true
      discriminator:
        propertyName: type
        mapping:
          server_vad: '#/components/schemas/RealtimeServerVadTurnDetection'
          semantic_vad: '#/components/schemas/RealtimeSemanticVadTurnDetection'
    RealtimeTurnDetectionType:
      anyOf:
        - type: string
        - type: string
          enum:
            - server_vad
            - semantic_vad
    Reasoning:
      type: object
      properties:
        effort:
          allOf:
            - $ref: '#/components/schemas/ReasoningEffort'
          nullable: true
          default: medium
        generate_summary:
          type: string
          enum:
            - concise
            - detailed
          nullable: true
          description: |-
            **computer_use_preview only**

            A summary of the reasoning performed by the model. This can be
            useful for debugging and understanding the model's reasoning process.
            One of `concise` or `detailed`.
          default: null
      description: |-
        **o-series models only**

        Configuration options for
        [reasoning models](https://platform.openai.com/docs/guides/reasoning).
      x-oaiExpandable: true
    ReasoningEffort:
      type: string
      enum:
        - low
        - medium
        - high
      description: |-
        **o-series models only** 

        Constrains effort on reasoning for 
        [reasoning models](https://platform.openai.com/docs/guides/reasoning).
        Currently supported values are `low`, `medium`, and `high`. Reducing
        reasoning effort can result in faster responses and fewer tokens used
        on reasoning in a response.
    ReasoningItem:
      type: object
      required:
        - type
        - summary
        - status
      properties:
        type:
          type: string
          enum:
            - reasoning
        summary:
          type: array
          items:
            $ref: '#/components/schemas/ReasoningItemSummary'
        status:
          type: string
          enum:
            - in_progress
            - completed
            - incomplete
          readOnly: true
      allOf:
        - $ref: '#/components/schemas/Item'
    ReasoningItemSummary:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/ReasoningItemSummaryType'
      discriminator:
        propertyName: type
        mapping:
          summary_text: '#/components/schemas/ReasoningItemSummaryText'
    ReasoningItemSummaryText:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - summary_text
        text:
          type: string
      allOf:
        - $ref: '#/components/schemas/ReasoningItemSummary'
    ReasoningItemSummaryType:
      anyOf:
        - type: string
        - type: string
          enum:
            - summary_text
      description: |-
        A description of the chain of thought used by a reasoning model while generating
        a response.
      x-oaiExpandable: true
    Response:
      type: object
      required:
        - metadata
        - temperature
        - top_p
        - user
        - id
        - object
        - created_at
        - error
        - incomplete_details
        - output
        - parallel_tool_calls
      properties:
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: |-
            Set of 16 key-value pairs that can be attached to an object. This can be
            useful for storing additional information about the object in a structured
            format, and querying for objects via API or the dashboard.

            Keys are strings with a maximum length of 64 characters. Values are strings
            with a maximum length of 512 characters.
          x-oaiTypeLabel: map
        temperature:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 2
          description: |-
            What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.
            We generally recommend altering this or `top_p` but not both.
        top_p:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: |-
            An alternative to sampling with temperature, called nucleus sampling,
            where the model considers the results of the tokens with top_p probability
            mass. So 0.1 means only the tokens comprising the top 10% probability mass
            are considered.

            We generally recommend altering this or `temperature` but not both.
        user:
          type: string
          nullable: true
          description: A unique identifier representing your end-user, which can help OpenAI to monitor and detect abuse. [Learn more](/docs/guides/safety-best-practices#end-user-ids).
        previous_response_id:
          type: string
          nullable: true
          description: |-
            The unique ID of the previous response to the model. Use this to
            create multi-turn conversations. Learn more about
            [conversation state](/docs/guides/conversation-state).
        model:
          allOf:
            - $ref: '#/components/schemas/ModelIdsResponses'
          description: |-
            Model ID used to generate the response, like `gpt-4o` or `o1`. OpenAI
            offers a wide range of models with different capabilities, performance
            characteristics, and price points. Refer to the [model guide](/docs/models)
            to browse and compare available models.
        reasoning:
          type: object
          allOf:
            - $ref: '#/components/schemas/Reasoning'
          nullable: true
        max_output_tokens:
          type: integer
          format: int32
          nullable: true
          description: An upper bound for the number of tokens that can be generated for a response, including visible output tokens and [reasoning tokens](/docs/guides/reasoning).
        instructions:
          type: string
          nullable: true
          description: |-
            Inserts a system (or developer) message as the first item in the model's context.

            When using along with `previous_response_id`, the instructions from a previous
            response will be not be carried over to the next response. This makes it simple
            to swap out system (or developer) messages in new responses.
        text:
          type: object
          properties:
            format:
              $ref: '#/components/schemas/ResponseTextFormatConfiguration'
          description: |-
            Configuration options for a text response from the model. Can be plain
            text or structured JSON data. Learn more:
            - [Text inputs and outputs](/docs/guides/text)
            - [Structured Outputs](/docs/guides/structured-outputs)
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
          description: |-
            An array of tools the model may call while generating a response. You 
            can specify which tool to use by setting the `tool_choice` parameter.

            The two categories of tools you can provide the model are:

            - **Built-in tools**: Tools that are provided by OpenAI that extend the
              model's capabilities, like [web search](/docs/guides/tools-web-search)
              or [file search](/docs/guides/tools-file-search). Learn more about
              [built-in tools](/docs/guides/tools).
            - **Function calls (custom tools)**: Functions that are defined by you,
              enabling the model to call your own code. Learn more about
              [function calling](/docs/guides/function-calling).
        tool_choice:
          anyOf:
            - $ref: '#/components/schemas/ToolChoiceOptions'
            - $ref: '#/components/schemas/ToolChoiceObject'
          description: |-
            How the model should select which tool (or tools) to use when generating
            a response. See the `tools` parameter to see how to specify which tools
            the model can call.
          x-oaiExpandable: true
        truncation:
          type: string
          enum:
            - auto
            - disabled
          nullable: true
          description: |-
            The truncation strategy to use for the model response.
            - `auto`: If the context of this response and previous ones exceeds
              the model's context window size, the model will truncate the 
              response to fit the context window by dropping input items in the
              middle of the conversation. 
            - `disabled` (default): If a model response will exceed the context window 
              size for a model, the request will fail with a 400 error.
          default: disabled
        id:
          type: string
          description: Unique identifier for this Response.
        object:
          type: string
          enum:
            - response
          description: The object type of this resource - always set to `response`.
        status:
          type: string
          enum:
            - completed
            - failed
            - in_progress
            - incomplete
          description: |-
            The status of the response generation. One of `completed`, `failed`, 
            `in_progress`, or `incomplete`.
        created_at:
          type: integer
          format: unixtime
          description: Unix timestamp (in seconds) of when this Response was created.
        error:
          type: object
          allOf:
            - $ref: '#/components/schemas/ResponseError'
          nullable: true
        incomplete_details:
          type: object
          properties:
            reason:
              type: string
              enum:
                - max_output_tokens
                - content_filter
              description: The reason why the response is incomplete.
          nullable: true
          description: Details about why the response is incomplete.
        output:
          type: array
          items:
            $ref: '#/components/schemas/Item'
          description: |-
            An array of content items generated by the model.

            - The length and order of items in the `output` array is dependent
              on the model's response.
            - Rather than accessing the first item in the `output` array and 
              assuming it's an `assistant` message with the content generated by
              the model, you might consider using the `output_text` property where
              supported in SDKs.
          x-oaiExpandable: true
        output_text:
          type: string
          nullable: true
          description: |-
            SDK-only convenience property that contains the aggregated text output 
            from all `output_text` items in the `output` array, if any are present. 
            Supported in the Python and JavaScript SDKs.
        usage:
          $ref: '#/components/schemas/ResponseUsage'
        parallel_tool_calls:
          type: boolean
          description: Whether to allow the model to run tool calls in parallel.
          default: true
    ResponseCompletedEvent:
      type: object
      required:
        - type
        - response
      properties:
        type:
          type: string
          enum:
            - response.completed
          description: The type of the event. Always `response.completed`.
        response:
          allOf:
            - $ref: '#/components/schemas/Response'
          description: Properties of the completed response.
      allOf:
        - $ref: '#/components/schemas/ResponseStreamEvent'
      description: Emitted when the model response is complete.
    ResponseContentPartAddedEvent:
      type: object
      required:
        - type
        - item_id
        - output_index
        - content_index
        - part
      properties:
        type:
          type: string
          enum:
            - response.content_part.added
          description: The type of the event. Always `response.content_part.added`.
        item_id:
          type: string
          description: The ID of the output item that the content part was added to.
        output_index:
          type: integer
          format: int32
          description: The index of the output item that the content part was added to.
        content_index:
          type: integer
          format: int32
          description: The index of the content part that was added.
        part:
          allOf:
            - $ref: '#/components/schemas/ItemContent'
          description: The content part that was added.
          x-oaiExpandable: true
      allOf:
        - $ref: '#/components/schemas/ResponseStreamEvent'
      description: Emitted when a new content part is added.
    ResponseContentPartDoneEvent:
      type: object
      required:
        - type
        - item_id
        - output_index
        - content_index
        - part
      properties:
        type:
          type: string
          enum:
            - response.content_part.done
          description: The type of the event. Always `response.content_part.done`.
        item_id:
          type: string
          description: The ID of the output item that the content part was added to.
        output_index:
          type: integer
          format: int32
          description: The index of the output item that the content part was added to.
        content_index:
          type: integer
          format: int32
          description: The index of the content part that is done.
        part:
          allOf:
            - $ref: '#/components/schemas/ItemContent'
          description: The content part that is done.
          x-oaiExpandable: true
      allOf:
        - $ref: '#/components/schemas/ResponseStreamEvent'
      description: Emitted when a content part is done.
    ResponseCreatedEvent:
      type: object
      required:
        - type
        - response
      properties:
        type:
          type: string
          enum:
            - response.created
          description: The type of the event. Always `response.created`.
        response:
          allOf:
            - $ref: '#/components/schemas/Response'
          description: The response that was created.
      allOf:
        - $ref: '#/components/schemas/ResponseStreamEvent'
      description: An event that is emitted when a response is created.
    ResponseError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ResponseErrorCode'
        message:
          type: string
          description: A human-readable description of the error.
      description: An error object returned when the model fails to generate a Response.
    ResponseErrorCode:
      type: string
      enum:
        - server_error
        - rate_limit_exceeded
        - invalid_prompt
        - vector_store_timeout
        - invalid_image
        - invalid_image_format
        - invalid_base64_image
        - invalid_image_url
        - image_too_large
        - image_too_small
        - image_parse_error
        - image_content_policy_violation
        - invalid_image_mode
