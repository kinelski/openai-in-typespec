          type: string
          description: The object identifier, which can be referenced in the API endpoints.
        created_at:
          type: integer
          format: unixtime
          description: The Unix timestamp (in seconds) for when the fine-tuning job was created.
        error:
          type: object
          properties:
            code:
              type: string
              description: A machine-readable error code.
            message:
              type: string
              description: A human-readable error message.
            param:
              type: string
              nullable: true
              description: The parameter that was invalid, usually `training_file` or `validation_file`. This field will be null if the failure was not parameter-specific.
          required:
            - code
            - message
            - param
          nullable: true
          description: For fine-tuning jobs that have `failed`, this will contain more information on the cause of the failure.
        fine_tuned_model:
          type: string
          nullable: true
          description: The name of the fine-tuned model that is being created. The value will be null if the fine-tuning job is still running.
        finished_at:
          type: integer
          format: unixtime
          nullable: true
          description: The Unix timestamp (in seconds) for when the fine-tuning job was finished. The value will be null if the fine-tuning job is still running.
        hyperparameters:
          type: object
          properties:
            batch_size:
              anyOf:
                - type: string
                  enum:
                    - auto
                - type: integer
                  format: int32
              description: |-
                Number of examples in each batch. A larger batch size means that model parameters
                are updated less frequently, but with lower variance.
              default: auto
            learning_rate_multiplier:
              anyOf:
                - type: string
                  enum:
                    - auto
                - type: number
                  format: float
              description: |-
                Scaling factor for the learning rate. A smaller learning rate may be useful to avoid
                overfitting.
              default: auto
            n_epochs:
              anyOf:
                - type: string
                  enum:
                    - auto
                - type: integer
                  format: int32
              description: |-
                The number of epochs to train the model for. An epoch refers to one full cycle
                through the training dataset.
              default: auto
          description: The hyperparameters used for the fine-tuning job. This value will only be returned when running `supervised` jobs.
        model:
          type: string
          description: The base model that is being fine-tuned.
        object:
          type: string
          enum:
            - fine_tuning.job
          description: The object type, which is always "fine_tuning.job".
        organization_id:
          type: string
          description: The organization that owns the fine-tuning job.
        result_files:
          type: array
          items:
            type: string
          description: The compiled results file ID(s) for the fine-tuning job. You can retrieve the results with the [Files API](/docs/api-reference/files/retrieve-contents).
        status:
          type: string
          enum:
            - validating_files
            - queued
            - running
            - succeeded
            - failed
            - cancelled
          description: The current status of the fine-tuning job, which can be either `validating_files`, `queued`, `running`, `succeeded`, `failed`, or `cancelled`.
        trained_tokens:
          type: integer
          format: int32
          nullable: true
          description: The total number of billable tokens processed by this fine-tuning job. The value will be null if the fine-tuning job is still running.
        training_file:
          type: string
          description: The file ID used for training. You can retrieve the training data with the [Files API](/docs/api-reference/files/retrieve-contents).
        validation_file:
          type: string
          nullable: true
          description: The file ID used for validation. You can retrieve the validation results with the [Files API](/docs/api-reference/files/retrieve-contents).
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/FineTuningIntegration'
          nullable: true
          description: A list of integrations to enable for this fine-tuning job.
        seed:
          type: integer
          format: int32
          description: The seed used for the fine-tuning job.
        estimated_finish:
          type: integer
          format: unixtime
          nullable: true
          description: The Unix timestamp (in seconds) for when the fine-tuning job is estimated to finish. The value will be null if the fine-tuning job is not running.
        method:
          $ref: '#/components/schemas/FineTuneMethod'
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: |-
            Set of 16 key-value pairs that can be attached to an object. This can be
            useful for storing additional information about the object in a structured
            format, and querying for objects via API or the dashboard.

            Keys are strings with a maximum length of 64 characters. Values are strings
            with a maximum length of 512 characters.
          x-oaiTypeLabel: map
      description: The `fine_tuning.job` object represents a fine-tuning job that has been created through the API.
    FineTuningJobCheckpoint:
