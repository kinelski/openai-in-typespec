        - near_field
        - far_field
    RealtimeClientEvent:
      type: object
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/RealtimeClientEventType'
          description: The type of event.
        event_id:
          type: string
      discriminator:
        propertyName: type
        mapping:
          session.update: '#/components/schemas/RealtimeClientEventSessionUpdate'
          input_audio_buffer.append: '#/components/schemas/RealtimeClientEventInputAudioBufferAppend'
          input_audio_buffer.commit: '#/components/schemas/RealtimeClientEventInputAudioBufferCommit'
          input_audio_buffer.clear: '#/components/schemas/RealtimeClientEventInputAudioBufferClear'
          conversation.item.create: '#/components/schemas/RealtimeClientEventConversationItemCreate'
          conversation.item.truncate: '#/components/schemas/RealtimeClientEventConversationItemTruncate'
          conversation.item.delete: '#/components/schemas/RealtimeClientEventConversationItemDelete'
          response.create: '#/components/schemas/RealtimeClientEventResponseCreate'
          response.cancel: '#/components/schemas/RealtimeClientEventResponseCancel'
          conversation.item.retrieve: '#/components/schemas/RealtimeClientEventConversationItemRetrieve'
          transcription_session.update: '#/components/schemas/RealtimeClientEventTranscriptionSessionUpdate'
      description: A realtime client event.
    RealtimeClientEventConversationItemCreate:
      type: object
      required:
        - type
        - item
      properties:
        type:
          type: string
          enum:
            - conversation.item.create
          description: The event type, must be `conversation.item.create`.
        previous_item_id:
          type: string
          description: |-
            The ID of the preceding item after which the new item will be inserted. 
            If not set, the new item will be appended to the end of the conversation.
            If set to `root`, the new item will be added to the beginning of the conversation.
            If set to an existing ID, it allows an item to be inserted mid-conversation. If the
            ID cannot be found, an error will be returned and the item will not be added.
        item:
          $ref: '#/components/schemas/RealtimeConversationRequestItem'
      allOf:
        - $ref: '#/components/schemas/RealtimeClientEvent'
      description: |-
        Add a new Item to the Conversation's context, including messages, function 
        calls, and function call responses. This event can be used both to populate a 
        "history" of the conversation and to add new items mid-stream, but has the 
        current limitation that it cannot populate assistant audio messages.

        If successful, the server will respond with a `conversation.item.created` 
        event, otherwise an `error` event will be sent.
    RealtimeClientEventConversationItemDelete:
      type: object
      required:
        - type
        - item_id
      properties:
        type:
          type: string
          enum:
            - conversation.item.delete
          description: The event type, must be `conversation.item.delete`.
        item_id:
          type: string
          description: The ID of the item to delete.
      allOf:
        - $ref: '#/components/schemas/RealtimeClientEvent'
      description: |-
        Send this event when you want to remove any item from the conversation 
        history. The server will respond with a `conversation.item.deleted` event, 
        unless the item does not exist in the conversation history, in which case the 
        server will respond with an error.
    RealtimeClientEventConversationItemRetrieve:
      type: object
      required:
        - type
        - item_id
      properties:
        type:
          type: string
          enum:
            - conversation.item.retrieve
          description: The event type, must be `conversation.item.retrieve`.
        item_id:
          type: string
          description: The ID of the item to retrieve.
      allOf:
        - $ref: '#/components/schemas/RealtimeClientEvent'
      description: |-
        Send this event when you want to retrieve the server's representation of a specific item in the conversation history. This is useful, for example, to inspect user audio after noise cancellation and VAD.
        The server will respond with a `conversation.item.retrieved` event, 
        unless the item does not exist in the conversation history, in which case the 
        server will respond with an error.
    RealtimeClientEventConversationItemTruncate:
      type: object
      required:
        - type
        - item_id
        - content_index
        - audio_end_ms
      properties:
        type:
          type: string
          enum:
            - conversation.item.truncate
          description: The event type, must be `conversation.item.truncate`.
        item_id:
          type: string
          description: |-
            The ID of the assistant message item to truncate. Only assistant message
            items can be truncated.
        content_index:
          type: integer
          format: int32
          description: The index of the content part to truncate. Set this to 0.
        audio_end_ms:
          type: integer
          format: int32
          description: |-
            Inclusive duration up to which audio is truncated, in milliseconds. If
            the audio_end_ms is greater than the actual audio duration, the server
            will respond with an error.
      allOf:
        - $ref: '#/components/schemas/RealtimeClientEvent'
      description: |-
        Send this event to truncate a previous assistant message’s audio. The server 
        will produce audio faster than realtime, so this event is useful when the user 
        interrupts to truncate audio that has already been sent to the client but not 
        yet played. This will synchronize the server's understanding of the audio with 
        the client's playback.

        Truncating audio will delete the server-side text transcript to ensure there 
        is not text in the context that hasn't been heard by the user.

        If successful, the server will respond with a `conversation.item.truncated` 
        event.
    RealtimeClientEventInputAudioBufferAppend:
      type: object
      required:
        - type
        - audio
      properties:
        type:
          type: string
          enum:
            - input_audio_buffer.append
          description: The event type, must be `input_audio_buffer.append`.
        audio:
          type: string
          format: base64
          description: |-
            Base64-encoded audio bytes. This must be in the format specified by the 
            `input_audio_format` field in the session configuration.
      allOf:
        - $ref: '#/components/schemas/RealtimeClientEvent'
      description: |-
        Send this event to append audio bytes to the input audio buffer. The audio
        buffer is temporary storage you can write to and later commit. In Server VAD
        mode, the audio buffer is used to detect speech and the server will decide
        when to commit. When Server VAD is disabled, you must commit the audio buffer
        manually.

        The client may choose how much audio to place in each event up to a maximum
        of 15 MiB, for example streaming smaller chunks from the client may allow the
        VAD to be more responsive. Unlike made other client events, the server will
        not send a confirmation response to this event.
    RealtimeClientEventInputAudioBufferClear:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - input_audio_buffer.clear
          description: The event type, must be `input_audio_buffer.clear`.
      allOf:
        - $ref: '#/components/schemas/RealtimeClientEvent'
      description: |-
        Send this event to clear the audio bytes in the buffer. The server will 
        respond with an `input_audio_buffer.cleared` event.
    RealtimeClientEventInputAudioBufferCommit:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - input_audio_buffer.commit
          description: The event type, must be `input_audio_buffer.commit`.
      allOf:
        - $ref: '#/components/schemas/RealtimeClientEvent'
      description: |-
        Send this event to commit the user input audio buffer, which will create a 
        new user message item in the conversation. This event will produce an error 
        if the input audio buffer is empty. When in Server VAD mode, the client does 
        not need to send this event, the server will commit the audio buffer 
        automatically.

        Committing the input audio buffer will trigger input audio transcription 
        (if enabled in session configuration), but it will not create a response 
        from the model. The server will respond with an `input_audio_buffer.committed` 
        event.
    RealtimeClientEventResponseCancel:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - response.cancel
          description: The event type, must be `response.cancel`.
        response_id:
          type: string
          description: |-
            A specific response ID to cancel - if not provided, will cancel an
            in-progress response in the default conversation.
      allOf:
        - $ref: '#/components/schemas/RealtimeClientEvent'
      description: |-
        Send this event to cancel an in-progress response. The server will respond 
        with a `response.cancelled` event or an error if there is no response to 
        cancel.
    RealtimeClientEventResponseCreate:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - response.create
          description: The event type, must be `response.create`.
        response:
          $ref: '#/components/schemas/RealtimeResponseCreateParams'
      allOf:
        - $ref: '#/components/schemas/RealtimeClientEvent'
      description: |-
        This event instructs the server to create a Response, which means triggering 
        model inference. When in Server VAD mode, the server will create Responses 
        automatically.

        A Response will include at least one Item, and may have two, in which case 
        the second will be a function call. These Items will be appended to the 
        conversation history.

        The server will respond with a `response.created` event, events for Items 
        and content created, and finally a `response.done` event to indicate the 
        Response is complete.

        The `response.create` event includes inference configuration like 
        `instructions`, and `temperature`. These fields will override the Session's 
        configuration for this Response only.
    RealtimeClientEventSessionUpdate:
      type: object
      required:
        - type
        - session
      properties:
        type:
          type: string
          enum:
            - session.update
          description: The event type, must be `session.update`.
        session:
          $ref: '#/components/schemas/RealtimeRequestSession'
      allOf:
        - $ref: '#/components/schemas/RealtimeClientEvent'
      description: |-
        Send this event to update the session’s default configuration.
        The client may send this event at any time to update any field,
        except for `voice`. However, note that once a session has been
        initialized with a particular `model`, it can’t be changed to
        another model using `session.update`.

        When the server receives a `session.update`, it will respond
        with a `session.updated` event showing the full, effective configuration.
        Only the fields that are present are updated. To clear a field like
        `instructions`, pass an empty string.
    RealtimeClientEventTranscriptionSessionUpdate:
      type: object
      required:
        - type
        - session
      properties:
        type:
          type: string
          enum:
            - transcription_session.update
          description: The event type, must be `transcription_session.update`.
        session:
          $ref: '#/components/schemas/RealtimeTranscriptionSessionCreateRequest'
      allOf:
        - $ref: '#/components/schemas/RealtimeClientEvent'
      description: Send this event to update a transcription session.
    RealtimeClientEventType:
      anyOf:
        - type: string
        - type: string
          enum:
            - session.update
            - input_audio_buffer.append
            - input_audio_buffer.commit
            - input_audio_buffer.clear
            - conversation.item.create
            - conversation.item.retrieve
            - conversation.item.truncate
            - conversation.item.delete
            - response.create
            - response.cancel
            - transcription_session.update
    RealtimeContentPart:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/RealtimeContentPartType'
      discriminator:
        propertyName: type
        mapping:
          input_text: '#/components/schemas/RealtimeRequestTextContentPart'
          input_audio: '#/components/schemas/RealtimeRequestAudioContentPart'
          text: '#/components/schemas/RealtimeResponseTextContentPart'
          audio: '#/components/schemas/RealtimeResponseAudioContentPart'
    RealtimeContentPartType:
      anyOf:
        - type: string
        - type: string
          enum:
            - input_text
            - input_audio
            - text
            - audio
    RealtimeConversationItemBase:
      type: object
      description: The item to add to the conversation.
      x-oaiExpandable: true
    RealtimeConversationItemWithReference:
      type: object
      properties:
        id:
          type: string
          description: |-
            For an item of type (`message` | `function_call` | `function_call_output`)
            this field allows the client to assign the unique ID of the item. It is
            not required because the server will generate one if not provided.

            For an item of type `item_reference`, this field is required and is a
            reference to any item that has previously existed in the conversation.
        type:
          type: string
          enum:
            - message
            - function_call
            - function_call_output
          description: The type of the item (`message`, `function_call`, `function_call_output`, `item_reference`).
        object:
          type: string
          enum:
            - realtime.item
          description: Identifier for the API object being returned - always `realtime.item`.
        status:
          type: string
          enum:
            - completed
            - incomplete
          description: |-
            The status of the item (`completed`, `incomplete`). These have no effect 
            on the conversation, but are accepted for consistency with the 
            `conversation.item.created` event.
        role:
          type: string
          enum:
            - user
            - assistant
            - system
          description: |-
            The role of the message sender (`user`, `assistant`, `system`), only 
            applicable for `message` items.
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - input_audio
                  - input_text
                  - item_reference
                  - text
                description: The content type (`input_text`, `input_audio`, `item_reference`, `text`).
              text:
                type: string
                description: The text content, used for `input_text` and `text` content types.
              id:
                type: string
                description: |-
                  ID of a previous conversation item to reference (for `item_reference`
                  content types in `response.create` events). These can reference both
                  client and server created items.
              audio:
                type: string
                description: Base64-encoded audio bytes, used for `input_audio` content type.
              transcript:
                type: string
                description: The transcript of the audio, used for `input_audio` content type.
          description: |-
            The content of the message, applicable for `message` items. 
            - Message items of role `system` support only `input_text` content
            - Message items of role `user` support `input_text` and `input_audio` 
              content
            - Message items of role `assistant` support `text` content.
        call_id:
          type: string
          description: |-
            The ID of the function call (for `function_call` and 
            `function_call_output` items). If passed on a `function_call_output` 
            item, the server will check that a `function_call` item with the same 
            ID exists in the conversation history.
        name:
          type: string
          description: The name of the function being called (for `function_call` items).
        arguments:
          type: string
          description: The arguments of the function call (for `function_call` items).
        output:
          type: string
          description: The output of the function call (for `function_call_output` items).
      description: The item to add to the conversation.
      x-oaiExpandable: true
    RealtimeConversationRequestItem:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/RealtimeItemType'
        id:
          type: string
      discriminator:
        propertyName: type
        mapping:
          message: '#/components/schemas/RealtimeRequestMessageItem'
          function_call: '#/components/schemas/RealtimeRequestFunctionCallItem'
          function_call_output: '#/components/schemas/RealtimeRequestFunctionCallOutputItem'
    RealtimeConversationResponseItem:
      type: object
      required:
        - object
        - type
        - id
      properties:
        object:
          type: string
          enum:
            - realtime.item
        type:
          $ref: '#/components/schemas/RealtimeItemType'
        id:
          type: string
          nullable: true
      discriminator:
        propertyName: type
        mapping:
          message: '#/components/schemas/RealtimeResponseMessageItem'
          function_call: '#/components/schemas/RealtimeResponseFunctionCallItem'
          function_call_output: '#/components/schemas/RealtimeResponseFunctionCallOutputItem'
    RealtimeFunctionTool:
      type: object
      required:
        - type
        - name
      properties:
        type:
          type: string
          enum:
            - function
        name:
          type: string
        description:
          type: string
        parameters: {}
      allOf:
        - $ref: '#/components/schemas/RealtimeTool'
      description: The definition of a function tool as used by the realtime endpoint.
    RealtimeItemStatus:
      anyOf:
        - type: string
        - type: string
          enum:
            - in_progress
            - completed
            - incomplete
    RealtimeItemType:
      anyOf:
        - type: string
        - type: string
          enum:
            - message
            - function_call
            - function_call_output
    RealtimeMessageRole:
      anyOf:
        - type: string
        - type: string
          enum:
            - system
            - user
            - assistant
    RealtimeModality:
      anyOf:
        - type: string
        - type: string
          enum:
            - text
            - audio
    RealtimeRequestAssistantMessageItem:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - assistant
        content:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeRequestTextContentPart'
      allOf:
        - $ref: '#/components/schemas/RealtimeRequestMessageItem'
    RealtimeRequestAudioContentPart:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - input_audio
        transcript:
          type: string
      allOf:
        - $ref: '#/components/schemas/RealtimeContentPart'
    RealtimeRequestFunctionCallItem:
      type: object
      required:
        - type
        - name
        - call_id
        - arguments
      properties:
        type:
          type: string
          enum:
            - function_call
        name:
          type: string
        call_id:
          type: string
        arguments:
          type: string
        status:
          $ref: '#/components/schemas/RealtimeItemStatus'
      allOf:
        - $ref: '#/components/schemas/RealtimeConversationRequestItem'
    RealtimeRequestFunctionCallOutputItem:
      type: object
      required:
        - type
        - call_id
        - output
      properties:
        type:
          type: string
          enum:
            - function_call_output
        call_id:
          type: string
        output:
          type: string
      allOf:
        - $ref: '#/components/schemas/RealtimeConversationRequestItem'
    RealtimeRequestMessageItem:
      type: object
      required:
        - type
        - role
      properties:
        type:
          type: string
          enum:
            - message
        role:
          $ref: '#/components/schemas/RealtimeMessageRole'
        status:
          $ref: '#/components/schemas/RealtimeItemStatus'
      discriminator:
        propertyName: role
        mapping:
          system: '#/components/schemas/RealtimeRequestSystemMessageItem'
          user: '#/components/schemas/RealtimeRequestUserMessageItem'
          assistant: '#/components/schemas/RealtimeRequestAssistantMessageItem'
      allOf:
        - $ref: '#/components/schemas/RealtimeConversationRequestItem'
    RealtimeRequestMessageReferenceItem:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - message
        id:
          type: string
    RealtimeRequestSession:
      type: object
      properties:
        modalities:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeModality'
        instructions:
          type: string
        model:
          type: string
          enum:
            - gpt-4o-realtime-preview
            - gpt-4o-realtime-preview-2024-10-01
            - gpt-4o-realtime-preview-2024-12-17
            - gpt-4o-mini-realtime-preview
            - gpt-4o-mini-realtime-preview-2024-12-17
        voice:
          $ref: '#/components/schemas/VoiceIdsShared'
        input_audio_format:
          allOf:
            - $ref: '#/components/schemas/RealtimeAudioFormat'
          default: pcm16
        output_audio_format:
          allOf:
            - $ref: '#/components/schemas/RealtimeAudioFormat'
          default: pcm16
        input_audio_transcription:
          type: object
          allOf:
            - $ref: '#/components/schemas/RealtimeAudioInputTranscriptionSettings'
          nullable: true
        turn_detection:
          type: object
          allOf:
            - $ref: '#/components/schemas/RealtimeTurnDetection'
          nullable: true
        input_audio_noise_reduction:
          $ref: '#/components/schemas/RealtimeAudioNoiseReduction'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeTool'
        tool_choice:
          $ref: '#/components/schemas/RealtimeToolChoice'
        temperature:
          type: number
          format: float
        max_response_output_tokens:
          anyOf:
            - type: integer
              format: int32
            - type: string
              enum:
                - inf
    RealtimeRequestSystemMessageItem:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
        content:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeRequestTextContentPart'
      allOf:
        - $ref: '#/components/schemas/RealtimeRequestMessageItem'
    RealtimeRequestTextContentPart:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - input_text
        text:
          type: string
      allOf:
        - $ref: '#/components/schemas/RealtimeContentPart'
    RealtimeRequestUserMessageItem:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
        content:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/RealtimeRequestTextContentPart'
              - $ref: '#/components/schemas/RealtimeRequestAudioContentPart'
      allOf:
        - $ref: '#/components/schemas/RealtimeRequestMessageItem'
    RealtimeResponse:
      type: object
      required:
        - metadata
      properties:
        id:
          type: string
          description: The unique ID of the response.
        object:
          type: string
          enum:
            - realtime.response
          description: The object type, must be `realtime.response`.
        status:
          type: string
          enum:
            - completed
            - cancelled
            - failed
            - incomplete
          description: |-
            The final status of the response (`completed`, `cancelled`, `failed`, or 
            `incomplete`).
        status_details:
          type: object
          properties:
            type:
              type: string
              enum:
                - completed
                - cancelled
                - failed
                - incomplete
              description: |-
                The type of error that caused the response to fail, corresponding 
                with the `status` field (`completed`, `cancelled`, `incomplete`, 
                `failed`).
            reason:
              type: string
              enum:
                - turn_detected
                - client_cancelled
                - max_output_tokens
                - content_filter
              description: |-
                The reason the Response did not complete. For a `cancelled` Response, 
                one of `turn_detected` (the server VAD detected a new start of speech) 
                or `client_cancelled` (the client sent a cancel event). For an 
                `incomplete` Response, one of `max_output_tokens` or `content_filter` 
                (the server-side safety filter activated and cut off the response).
            error:
              type: object
              properties:
                type:
                  type: string
                  description: The type of error.
                code:
                  type: string
                  description: Error code, if any.
              description: |-
                A description of the error that caused the response to fail, 
                populated when the `status` is `failed`.
          description: Additional details about the status.
        output:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeConversationResponseItem'
          description: The list of output items generated by the response.
        metadata:
          type: object
          additionalProperties:
            type: string
          nullable: true
          description: |-
            Set of 16 key-value pairs that can be attached to an object. This can be
            useful for storing additional information about the object in a structured
            format, and querying for objects via API or the dashboard.

            Keys are strings with a maximum length of 64 characters. Values are strings
            with a maximum length of 512 characters.
          x-oaiTypeLabel: map
        usage:
          type: object
          properties:
            total_tokens:
              type: integer
              format: int32
              description: |-
                The total number of tokens in the Response including input and output
                text and audio tokens.
            input_tokens:
              type: integer
              format: int32
              description: |-
                The number of input tokens used in the Response, including text and
                audio tokens.
            output_tokens:
              type: integer
              format: int32
              description: |-
                The number of output tokens sent in the Response, including text and
                audio tokens.
            input_token_details:
              type: object
              properties:
                cached_tokens:
                  type: integer
                  format: int32
                  description: The number of cached tokens used in the Response.
                text_tokens:
                  type: integer
                  format: int32
                  description: The number of text tokens used in the Response.
                audio_tokens:
                  type: integer
                  format: int32
                  description: The number of audio tokens used in the Response.
              description: Details about the input tokens used in the Response.
            output_token_details:
              type: object
              properties:
                text_tokens:
                  type: integer
                  format: int32
                  description: The number of text tokens used in the Response.
                audio_tokens:
                  type: integer
                  format: int32
                  description: The number of audio tokens used in the Response.
              description: Details about the output tokens used in the Response.
          description: |-
            Usage statistics for the Response, this will correspond to billing. A
            Realtime API session will maintain a conversation context and append new
            Items to the Conversation, thus output from previous turns (text and
            audio tokens) will become the input for later turns.
        conversation_id:
          type: string
          description: |-
            Which conversation the response is added to, determined by the `conversation`
            field in the `response.create` event. If `auto`, the response will be added to
            the default conversation and the value of `conversation_id` will be an id like
            `conv_1234`. If `none`, the response will not be added to any conversation and
            the value of `conversation_id` will be `null`. If responses are being triggered
            by server VAD, the response will be added to the default conversation, thus
            the `conversation_id` will be an id like `conv_1234`.
        voice:
          allOf:
            - $ref: '#/components/schemas/VoiceIdsShared'
          description: |-
            The voice the model used to respond.
            Current voice options are `alloy`, `ash`, `ballad`, `coral`, `echo`, `fable`,
            `onyx`, `nova`, `sage`, `shimmer`, and `verse`.
        modalities:
          type: array
          items:
            type: string
            enum:
              - text
              - audio
          description: |-
            The set of modalities the model used to respond. If there are multiple modalities,
            the model will pick one, for example if `modalities` is `["text", "audio"]`, the model
            could be responding in either text or audio.
        output_audio_format:
          type: string
          enum:
            - pcm16
            - g711_ulaw
            - g711_alaw
          description: The format of output audio. Options are `pcm16`, `g711_ulaw`, or `g711_alaw`.
        temperature:
          type: number
          format: float
          description: Sampling temperature for the model, limited to [0.6, 1.2]. Defaults to 0.8.
        max_output_tokens:
          anyOf:
            - type: integer
              format: int32
            - type: string
              enum:
                - inf
          description: |-
            Maximum number of output tokens for a single assistant response,
            inclusive of tool calls, that was used in this response.
      description: The response resource.
    RealtimeResponseAudioContentPart:
      type: object
      required:
        - type
        - transcript
      properties:
        type:
          type: string
          enum:
            - audio
        transcript:
          type: string
          nullable: true
      allOf:
        - $ref: '#/components/schemas/RealtimeContentPart'
    RealtimeResponseCreateParams:
      type: object
      properties:
        modalities:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeModality'
          description: |-
            The set of modalities the model can respond with. To disable audio,
            set this to ["text"].
        instructions:
          type: string
          description: |-
            The default system instructions (i.e. system message) prepended to model 
            calls. This field allows the client to guide the model on desired 
            responses. The model can be instructed on response content and format, 
            (e.g. "be extremely succinct", "act friendly", "here are examples of good 
            responses") and on audio behavior (e.g. "talk quickly", "inject emotion 
            into your voice", "laugh frequently"). The instructions are not guaranteed 
            to be followed by the model, but they provide guidance to the model on the 
            desired behavior.

            Note that the server sets default instructions which will be used if this 
            field is not set and are visible in the `session.created` event at the 
            start of the session.
        voice:
          allOf:
            - $ref: '#/components/schemas/VoiceIdsShared'
          description: |-
            The voice the model uses to respond. Voice cannot be changed during the 
            session once the model has responded with audio at least once. Current 
            voice options are `alloy`, `ash`, `ballad`, `coral`, `echo`, `fable`,
            `onyx`, `nova`, `sage`, `shimmer`, and `verse`.
        output_audio_format:
          allOf:
            - $ref: '#/components/schemas/RealtimeAudioFormat'
          description: The format of output audio. Options are `pcm16`, `g711_ulaw`, or `g711_alaw`.
          default: pcm16
        tools:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeTool'
          description: Tools (functions) available to the model.
        tool_choice:
          type: string
          description: |-
            How the model chooses tools. Options are `auto`, `none`, `required`, or 
            specify a function, like `{"type": "function", "function": {"name": "my_function"}}`.
        temperature:
          type: number
          format: float
          description: Sampling temperature for the model, limited to [0.6, 1.2]. Defaults to 0.8.
        max_output_tokens:
          anyOf:
            - type: integer
              format: int32
            - type: string
              enum:
                - inf
          description: |-
            Maximum number of output tokens for a single assistant response,
            inclusive of tool calls. Provide an integer between 1 and 4096 to
            limit output tokens, or `inf` for the maximum available tokens for a
            given model. Defaults to `inf`.
        conversation:
          anyOf:
            - type: string
            - type: string
              enum:
                - auto
                - none
          description: |-
            Controls which conversation the response is added to. Currently supports
            `auto` and `none`, with `auto` as the default value. The `auto` value
            means that the contents of the response will be added to the default
            conversation. Set this to `none` to create an out-of-band response which 
            will not add items to default conversation.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: |-
            Set of 16 key-value pairs that can be attached to an object. This can be
            useful for storing additional information about the object in a structured
            format, and querying for objects via API or the dashboard.

            Keys are strings with a maximum length of 64 characters. Values are strings
            with a maximum length of 512 characters.
          x-oaiTypeLabel: map
        input:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeConversationRequestItem'
          description: |-
            Input items to include in the prompt for the model. Using this field
            creates a new context for this Response instead of using the default
            conversation. An empty array `[]` will clear the context for this Response.
            Note that this can include references to items from the default conversation.
      description: Create a new Realtime response with these parameters
    RealtimeResponseFunctionCallItem:
      type: object
      required:
        - type
        - name
        - call_id
        - arguments
        - status
      properties:
        type:
          type: string
          enum:
            - function_call
        name:
          type: string
        call_id:
          type: string
        arguments:
          type: string
        status:
          $ref: '#/components/schemas/RealtimeItemStatus'
      allOf:
        - $ref: '#/components/schemas/RealtimeConversationResponseItem'
    RealtimeResponseFunctionCallOutputItem:
      type: object
      required:
        - type
        - call_id
        - output
      properties:
        type:
          type: string
          enum:
            - function_call_output
        call_id:
          type: string
        output:
          type: string
      allOf:
        - $ref: '#/components/schemas/RealtimeConversationResponseItem'
    RealtimeResponseMessageItem:
      type: object
      required:
        - type
        - role
        - content
        - status
      properties:
        type:
          type: string
          enum:
            - message
        role:
          $ref: '#/components/schemas/RealtimeMessageRole'
        content:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeContentPart'
        status:
          $ref: '#/components/schemas/RealtimeItemStatus'
      allOf:
        - $ref: '#/components/schemas/RealtimeConversationResponseItem'
    RealtimeResponseSession:
      type: object
      required:
        - object
        - id
        - model
        - modalities
        - instructions
        - voice
        - input_audio_format
        - output_audio_format
        - input_audio_transcription
        - turn_detection
        - input_audio_noise_reduction
        - tools
        - tool_choice
        - temperature
        - max_response_output_tokens
      properties:
        object:
          type: string
          enum:
            - realtime.session
        id:
          type: string
        model:
          type: string
        modalities:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeModality'
        instructions:
          type: string
        voice:
          $ref: '#/components/schemas/VoiceIdsShared'
        input_audio_format:
          $ref: '#/components/schemas/RealtimeAudioFormat'
        output_audio_format:
          $ref: '#/components/schemas/RealtimeAudioFormat'
        input_audio_transcription:
          type: object
          allOf:
            - $ref: '#/components/schemas/RealtimeAudioInputTranscriptionSettings'
          nullable: true
        turn_detection:
          $ref: '#/components/schemas/RealtimeTurnDetection'
        input_audio_noise_reduction:
          $ref: '#/components/schemas/RealtimeAudioNoiseReduction'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeTool'
        tool_choice:
          $ref: '#/components/schemas/RealtimeToolChoice'
        temperature:
          type: number
          format: float
        max_response_output_tokens:
          anyOf:
            - type: integer
              format: int32
            - type: string
              enum:
                - inf
          nullable: true
    RealtimeResponseTextContentPart:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
        text:
          type: string
      allOf:
        - $ref: '#/components/schemas/RealtimeContentPart'
    RealtimeSemanticVadTurnDetection:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - semantic_vad
        eagerness:
          type: string
          enum:
            - low
            - medium
            - high
            - auto
          description: Used only for `semantic_vad` mode. The eagerness of the model to respond. `low` will wait longer for the user to continue speaking, `high` will respond more quickly. `auto` is the default and is equivalent to `medium`.
          default: auto
      allOf:
        - $ref: '#/components/schemas/RealtimeTurnDetection'
    RealtimeServerEvent:
      type: object
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/RealtimeServerEventType'
          description: The type of event.
        event_id:
          type: string
      discriminator:
        propertyName: type
        mapping:
          error: '#/components/schemas/RealtimeServerEventError'
          session.created: '#/components/schemas/RealtimeServerEventSessionCreated'
          session.updated: '#/components/schemas/RealtimeServerEventSessionUpdated'
          conversation.created: '#/components/schemas/RealtimeServerEventConversationCreated'
          input_audio_buffer.committed: '#/components/schemas/RealtimeServerEventInputAudioBufferCommitted'
          input_audio_buffer.cleared: '#/components/schemas/RealtimeServerEventInputAudioBufferCleared'
          input_audio_buffer.speech_started: '#/components/schemas/RealtimeServerEventInputAudioBufferSpeechStarted'
          input_audio_buffer.speech_stopped: '#/components/schemas/RealtimeServerEventInputAudioBufferSpeechStopped'
          conversation.item.created: '#/components/schemas/RealtimeServerEventConversationItemCreated'
          conversation.item.input_audio_transcription.completed: '#/components/schemas/RealtimeServerEventConversationItemInputAudioTranscriptionCompleted'
          conversation.item.input_audio_transcription.failed: '#/components/schemas/RealtimeServerEventConversationItemInputAudioTranscriptionFailed'
          conversation.item.truncated: '#/components/schemas/RealtimeServerEventConversationItemTruncated'
          conversation.item.deleted: '#/components/schemas/RealtimeServerEventConversationItemDeleted'
          response.created: '#/components/schemas/RealtimeServerEventResponseCreated'
          response.done: '#/components/schemas/RealtimeServerEventResponseDone'
          response.output_item.added: '#/components/schemas/RealtimeServerEventResponseOutputItemAdded'
          response.output_item.done: '#/components/schemas/RealtimeServerEventResponseOutputItemDone'
          response.content_part.added: '#/components/schemas/RealtimeServerEventResponseContentPartAdded'
          response.content_part.done: '#/components/schemas/RealtimeServerEventResponseContentPartDone'
          response.text.delta: '#/components/schemas/RealtimeServerEventResponseTextDelta'
          response.text.done: '#/components/schemas/RealtimeServerEventResponseTextDone'
          response.audio_transcript.delta: '#/components/schemas/RealtimeServerEventResponseAudioTranscriptDelta'
          response.audio_transcript.done: '#/components/schemas/RealtimeServerEventResponseAudioTranscriptDone'
          response.audio.delta: '#/components/schemas/RealtimeServerEventResponseAudioDelta'
          response.audio.done: '#/components/schemas/RealtimeServerEventResponseAudioDone'
          response.function_call_arguments.delta: '#/components/schemas/RealtimeServerEventResponseFunctionCallArgumentsDelta'
          response.function_call_arguments.done: '#/components/schemas/RealtimeServerEventResponseFunctionCallArgumentsDone'
          rate_limits.updated: '#/components/schemas/RealtimeServerEventRateLimitsUpdated'
          conversation.item.input_audio_transcription.delta: '#/components/schemas/RealtimeServerEventConversationItemInputAudioTranscriptionDelta'
          conversation.item.retrieved: '#/components/schemas/RealtimeServerEventConversationItemRetrieved'
          transcription_session.updated: '#/components/schemas/RealtimeServerEventTranscriptionSessionUpdated'
      description: A realtime server event.
    RealtimeServerEventConversationCreated:
      type: object
      required:
        - type
        - conversation
      properties:
        type:
          type: string
          enum:
            - conversation.created
          description: The event type, must be `conversation.created`.
        conversation:
          type: object
          properties:
            id:
              type: string
              description: The unique ID of the conversation.
            object:
              type: string
              description: The object type, must be `realtime.conversation`.
          description: The conversation resource.
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: Returned when a conversation is created. Emitted right after session creation.
    RealtimeServerEventConversationItemCreated:
      type: object
      required:
        - type
        - previous_item_id
        - item
      properties:
        type:
          type: string
          enum:
            - conversation.item.created
          description: The event type, must be `conversation.item.created`.
        previous_item_id:
          type: string
          description: |-
            The ID of the preceding item in the Conversation context, allows the
            client to understand the order of the conversation.
        item:
          $ref: '#/components/schemas/RealtimeConversationResponseItem'
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: |-
        Returned when a conversation item is created. There are several scenarios that produce this event:
          - The server is generating a Response, which if successful will produce 
            either one or two Items, which will be of type `message` 
            (role `assistant`) or type `function_call`.
          - The input audio buffer has been committed, either by the client or the 
            server (in `server_vad` mode). The server will take the content of the 
            input audio buffer and add it to a new user message Item.
          - The client has sent a `conversation.item.create` event to add a new Item 
            to the Conversation.
    RealtimeServerEventConversationItemDeleted:
      type: object
      required:
        - type
        - item_id
      properties:
        type:
          type: string
          enum:
            - conversation.item.deleted
          description: The event type, must be `conversation.item.deleted`.
        item_id:
          type: string
          description: The ID of the item that was deleted.
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: |-
        Returned when an item in the conversation is deleted by the client with a 
        `conversation.item.delete` event. This event is used to synchronize the 
        server's understanding of the conversation history with the client's view.
    RealtimeServerEventConversationItemInputAudioTranscriptionCompleted:
      type: object
      required:
        - type
        - item_id
        - content_index
        - transcript
      properties:
        type:
          type: string
          enum:
            - conversation.item.input_audio_transcription.completed
          description: |-
            The event type, must be
            `conversation.item.input_audio_transcription.completed`.
        item_id:
          type: string
          description: The ID of the user message item containing the audio.
        content_index:
          type: integer
          format: int32
          description: The index of the content part containing the audio.
        transcript:
          type: string
          description: The transcribed text.
        logprobs:
          type: array
          items:
            $ref: '#/components/schemas/LogProbProperties'
          nullable: true
          description: The log probabilities of the transcription.
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: |-
        This event is the output of audio transcription for user audio written to the 
        user audio buffer. Transcription begins when the input audio buffer is 
        committed by the client or server (in `server_vad` mode). Transcription runs 
        asynchronously with Response creation, so this event may come before or after 
        the Response events.

        Realtime API models accept audio natively, and thus input transcription is a 
        separate process run on a separate ASR (Automatic Speech Recognition) model, 
        currently always `whisper-1`. Thus the transcript may diverge somewhat from 
        the model's interpretation, and should be treated as a rough guide.
    RealtimeServerEventConversationItemInputAudioTranscriptionDelta:
      type: object
      required:
        - type
        - item_id
      properties:
        type:
          type: string
          enum:
            - conversation.item.input_audio_transcription.delta
          description: The event type, must be `conversation.item.input_audio_transcription.delta`.
        item_id:
          type: string
          description: The ID of the item.
        content_index:
          type: integer
          format: int32
          description: The index of the content part in the item's content array.
        delta:
          type: string
          description: The text delta.
        logprobs:
          type: array
          items:
            $ref: '#/components/schemas/LogProbProperties'
          nullable: true
          description: The log probabilities of the transcription.
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: Returned when the text value of an input audio transcription content part is updated.
    RealtimeServerEventConversationItemInputAudioTranscriptionFailed:
      type: object
      required:
        - type
        - item_id
        - content_index
        - error
      properties:
        type:
          type: string
          enum:
            - conversation.item.input_audio_transcription.failed
          description: |-
            The event type, must be
            `conversation.item.input_audio_transcription.failed`.
        item_id:
          type: string
          description: The ID of the user message item.
        content_index:
          type: integer
          format: int32
          description: The index of the content part containing the audio.
        error:
          type: object
          properties:
            type:
              type: string
              description: The type of error.
            code:
              type: string
              description: Error code, if any.
            message:
              type: string
              description: A human-readable error message.
            param:
              type: string
              description: Parameter related to the error, if any.
          description: Details of the transcription error.
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: |-
        Returned when input audio transcription is configured, and a transcription 
        request for a user message failed. These events are separate from other 
        `error` events so that the client can identify the related Item.
    RealtimeServerEventConversationItemRetrieved:
      type: object
      required:
        - type
        - item
      properties:
        type:
          type: string
          enum:
            - conversation.item.retrieved
          description: The event type, must be `conversation.item.retrieved`.
        item:
          $ref: '#/components/schemas/RealtimeConversationResponseItem'
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: Returned when a conversation item is retrieved with `conversation.item.retrieve`.
    RealtimeServerEventConversationItemTruncated:
      type: object
      required:
        - type
        - item_id
        - content_index
        - audio_end_ms
      properties:
        type:
          type: string
          enum:
            - conversation.item.truncated
          description: The event type, must be `conversation.item.truncated`.
        item_id:
          type: string
          description: The ID of the assistant message item that was truncated.
        content_index:
          type: integer
          format: int32
          description: The index of the content part that was truncated.
        audio_end_ms:
          type: integer
          format: int32
          description: The duration up to which the audio was truncated, in milliseconds.
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: |-
        Returned when an earlier assistant audio message item is truncated by the 
        client with a `conversation.item.truncate` event. This event is used to 
        synchronize the server's understanding of the audio with the client's playback.

        This action will truncate the audio and remove the server-side text transcript 
        to ensure there is no text in the context that hasn't been heard by the user.
    RealtimeServerEventError:
      type: object
      required:
        - type
        - error
      properties:
        type:
          type: string
          enum:
            - error
          description: The event type, must be `error`.
        error:
          type: object
          properties:
            type:
              type: string
              description: The type of error (e.g., "invalid_request_error", "server_error").
            code:
              type: string
              nullable: true
              description: Error code, if any.
            message:
              type: string
              description: A human-readable error message.
            param:
              type: string
              nullable: true
              description: Parameter related to the error, if any.
            event_id:
              type: string
              nullable: true
              description: The event_id of the client event that caused the error, if applicable.
          required:
            - type
            - message
          description: Details of the error.
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: |-
        Returned when an error occurs, which could be a client problem or a server
        problem. Most errors are recoverable and the session will stay open, we
        recommend to implementors to monitor and log error messages by default.
    RealtimeServerEventInputAudioBufferCleared:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - input_audio_buffer.cleared
          description: The event type, must be `input_audio_buffer.cleared`.
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: |-
        Returned when the input audio buffer is cleared by the client with a 
        `input_audio_buffer.clear` event.
    RealtimeServerEventInputAudioBufferCommitted:
      type: object
      required:
        - type
        - previous_item_id
        - item_id
      properties:
        type:
          type: string
          enum:
            - input_audio_buffer.committed
          description: The event type, must be `input_audio_buffer.committed`.
        previous_item_id:
          type: string
          description: The ID of the preceding item after which the new item will be inserted.
        item_id:
          type: string
          description: The ID of the user message item that will be created.
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: |-
        Returned when an input audio buffer is committed, either by the client or 
        automatically in server VAD mode. The `item_id` property is the ID of the user
        message item that will be created, thus a `conversation.item.created` event 
        will also be sent to the client.
    RealtimeServerEventInputAudioBufferSpeechStarted:
      type: object
      required:
        - type
        - audio_start_ms
        - item_id
      properties:
        type:
          type: string
          enum:
            - input_audio_buffer.speech_started
          description: The event type, must be `input_audio_buffer.speech_started`.
        audio_start_ms:
          type: integer
          format: int32
          description: |-
            Milliseconds from the start of all audio written to the buffer during the 
            session when speech was first detected. This will correspond to the 
            beginning of audio sent to the model, and thus includes the 
            `prefix_padding_ms` configured in the Session.
        item_id:
          type: string
          description: The ID of the user message item that will be created when speech stops.
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: |-
        Sent by the server when in `server_vad` mode to indicate that speech has been 
        detected in the audio buffer. This can happen any time audio is added to the 
        buffer (unless speech is already detected). The client may want to use this 
        event to interrupt audio playback or provide visual feedback to the user. 

        The client should expect to receive a `input_audio_buffer.speech_stopped` event 
        when speech stops. The `item_id` property is the ID of the user message item 
        that will be created when speech stops and will also be included in the 
        `input_audio_buffer.speech_stopped` event (unless the client manually commits 
        the audio buffer during VAD activation).
    RealtimeServerEventInputAudioBufferSpeechStopped:
      type: object
      required:
        - type
        - audio_end_ms
        - item_id
      properties:
        type:
          type: string
          enum:
            - input_audio_buffer.speech_stopped
          description: The event type, must be `input_audio_buffer.speech_stopped`.
        audio_end_ms:
          type: integer
          format: int32
          description: |-
            Milliseconds since the session started when speech stopped. This will 
            correspond to the end of audio sent to the model, and thus includes the 
            `min_silence_duration_ms` configured in the Session.
        item_id:
          type: string
          description: The ID of the user message item that will be created.
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: |-
        Returned in `server_vad` mode when the server detects the end of speech in 
        the audio buffer. The server will also send an `conversation.item.created` 
        event with the user message item that is created from the audio buffer.
    RealtimeServerEventRateLimitsUpdated:
      type: object
      required:
        - type
        - rate_limits
      properties:
        type:
          type: string
          enum:
            - rate_limits.updated
          description: The event type, must be `rate_limits.updated`.
        rate_limits:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeServerEventRateLimitsUpdatedRateLimitsItem'
          description: List of rate limit information.
      allOf:
        - $ref: '#/components/schemas/RealtimeServerEvent'
      description: |-
        Emitted at the beginning of a Response to indicate the updated rate limits.
        When a Response is created some tokens will be "reserved" for the output
        tokens, the rate limits shown here reflect that reservation, which is then
        adjusted accordingly once the Response is completed.
    RealtimeServerEventRateLimitsUpdatedRateLimitsItem:
      type: object
      required:
        - name
        - limit
        - remaining
        - reset_seconds
      properties:
        name:
          type: string
          description: The rate limit property name that this item includes information about.
        limit:
          type: integer
          format: int32
          description: The maximum configured limit for this rate limit property.
        remaining:
          type: integer
          format: int32
          description: The remaining quota available against the configured limit for this rate limit property.
