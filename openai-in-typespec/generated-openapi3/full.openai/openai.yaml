    RealtimeServerVadTurnDetection:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - server_vad
        threshold:
          type: number
          format: float
          description: Activation threshold for VAD (0.0 to 1.0), this defaults to 0.5. A higher threshold will require louder audio to activate the model, and thus might perform better in noisy environments.
          default: 0.5
        prefix_padding_ms:
          type: string
          format: duration
          description: Amount of audio to include before the VAD detected speech (in milliseconds). Defaults to 300ms.
        silence_duration_ms:
          type: string
          format: duration
          description: Duration of silence to detect speech stop (in milliseconds). Defaults to 500ms. With shorter values the model will respond more quickly, but may jump in on short pauses from the user.
      allOf:
        - $ref: '#/components/schemas/RealtimeTurnDetection'
    RealtimeSessionBase:
      type: object
      description: Realtime session object configuration.
    RealtimeSessionCreateRequest:
      type: object
      properties:
        modalities:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeModality'
          description: |-
            The set of modalities the model can respond with. To disable audio,
            set this to ["text"].
        model:
          type: string
          enum:
            - gpt-4o-realtime-preview
            - gpt-4o-realtime-preview-2024-10-01
            - gpt-4o-realtime-preview-2024-12-17
            - gpt-4o-mini-realtime-preview
            - gpt-4o-mini-realtime-preview-2024-12-17
          description: The Realtime model used for this session.
        instructions:
          type: string
          description: |-
            The default system instructions (i.e. system message) prepended to model  calls. This field allows the client to guide the model on desired  responses. The model can be instructed on response content and format,  (e.g. "be extremely succinct", "act friendly", "here are examples of good  responses") and on audio behavior (e.g. "talk quickly", "inject emotion  into your voice", "laugh frequently"). The instructions are not guaranteed  to be followed by the model, but they provide guidance to the model on the desired behavior.

            Note that the server sets default instructions which will be used if this  field is not set and are visible in the `session.created` event at the  start of the session.
        voice:
          allOf:
            - $ref: '#/components/schemas/VoiceIdsShared'
          description: |-
            The voice the model uses to respond. Voice cannot be changed during the 
            session once the model has responded with audio at least once. Current 
            voice options are `alloy`, `ash`, `ballad`, `coral`, `echo`, `fable`,
            `onyx`, `nova`, `sage`, `shimmer`, and `verse`.
        input_audio_format:
          allOf:
            - $ref: '#/components/schemas/RealtimeAudioFormat'
          description: |-
            The format of input audio. Options are `pcm16`, `g711_ulaw`, or `g711_alaw`.
            For `pcm16`, input audio must be 16-bit PCM at a 24kHz sample rate, 
            single channel (mono), and little-endian byte order.
          default: pcm16
        output_audio_format:
          allOf:
            - $ref: '#/components/schemas/RealtimeAudioFormat'
          description: |-
            The format of output audio. Options are `pcm16`, `g711_ulaw`, or `g711_alaw`.
            For `pcm16`, output audio is sampled at a rate of 24kHz.
          default: pcm16
        input_audio_transcription:
          type: object
          properties:
            model:
              type: string
              description: The model to use for transcription, current options are `gpt-4o-transcribe`, `gpt-4o-mini-transcribe`, and `whisper-1`.
            language:
              type: string
              description: |-
                The language of the input audio. Supplying the input language in
                [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) (e.g. `en`) format
                will improve accuracy and latency.
            prompt:
              type: string
              description: |-
                An optional text to guide the model's style or continue a previous audio
                segment.
                For `whisper-1`, the [prompt is a list of keywords](/docs/guides/speech-to-text#prompting).
                For `gpt-4o-transcribe` models, the prompt is a free text string, for example "expect words related to technology".
          description: Configuration for input audio transcription, defaults to off and can be  set to `null` to turn off once on. Input audio transcription is not native to the model, since the model consumes audio directly. Transcription runs  asynchronously through [the /audio/transcriptions endpoint](https://platform.openai.com/docs/api-reference/audio/createTranscription) and should be treated as guidance of input audio content rather than precisely what the model heard. The client can optionally set the language and prompt for transcription, these offer additional guidance to the transcription service.
        turn_detection:
          type: object
          properties:
            type:
              type: string
              enum:
                - server_vad
                - semantic_vad
              description: Type of turn detection.
              default: server_vad
            eagerness:
              type: string
              enum:
                - low
                - medium
                - high
                - auto
              description: Used only for `semantic_vad` mode. The eagerness of the model to respond. `low` will wait longer for the user to continue speaking, `high` will respond more quickly. `auto` is the default and is equivalent to `medium`.
              default: auto
            threshold:
              type: number
              format: float
              description: |-
                Used only for `server_vad` mode. Activation threshold for VAD (0.0 to 1.0), this defaults to 0.5. A 
                higher threshold will require louder audio to activate the model, and 
                thus might perform better in noisy environments.
            prefix_padding_ms:
              type: integer
              format: int32
              description: |-
                Used only for `server_vad` mode. Amount of audio to include before the VAD detected speech (in 
                milliseconds). Defaults to 300ms.
            silence_duration_ms:
              type: integer
              format: int32
              description: |-
                Used only for `server_vad` mode. Duration of silence to detect speech stop (in milliseconds). Defaults 
                to 500ms. With shorter values the model will respond more quickly, 
                but may jump in on short pauses from the user.
            create_response:
              type: boolean
              description: Whether or not to automatically generate a response when a VAD stop event occurs.
              default: true
            interrupt_response:
              type: boolean
              description: |-
                Whether or not to automatically interrupt any ongoing response with output to the default
                conversation (i.e. `conversation` of `auto`) when a VAD start event occurs.
              default: true
          description: |-
            Configuration for turn detection, ether Server VAD or Semantic VAD. This can be set to `null` to turn off, in which case the client must manually trigger model response.
            Server VAD means that the model will detect the start and end of speech based on audio volume and respond at the end of user speech.
            Semantic VAD is more advanced and uses a turn detection model (in conjuction with VAD) to semantically estimate whether the user has finished speaking, then dynamically sets a timeout based on this probability. For example, if user audio trails off with "uhhm", the model will score a low probability of turn end and wait longer for the user to continue speaking. This can be useful for more natural conversations, but may have a higher latency.
        input_audio_noise_reduction:
          type: object
          properties:
            type:
              type: string
              enum:
                - near_field
                - far_field
              description: Type of noise reduction. `near_field` is for close-talking microphones such as headphones, `far_field` is for far-field microphones such as laptop or conference room microphones.
          nullable: true
          description: |-
            Configuration for input audio noise reduction. This can be set to `null` to turn off.
            Noise reduction filters audio added to the input audio buffer before it is sent to VAD and the model.
            Filtering the audio can improve VAD and turn detection accuracy (reducing false positives) and model performance by improving perception of the input audio.
          default: null
        tools:
          type: array
          items:
            $ref: '#/components/schemas/RealtimeTool'
          description: Tools (functions) available to the model.
        tool_choice:
          type: string
          description: |-
            How the model chooses tools. Options are `auto`, `none`, `required`, or 
            specify a function.
          default: auto
        temperature:
          type: number
          format: float
          description: Sampling temperature for the model, limited to [0.6, 1.2]. For audio models a temperature of 0.8 is highly recommended for best performance.
          default: 0.8
        max_response_output_tokens:
          anyOf:
            - type: integer
              format: int32
            - type: string
              enum:
                - inf
          description: |-
            Maximum number of output tokens for a single assistant response,
            inclusive of tool calls. Provide an integer between 1 and 4096 to
            limit output tokens, or `inf` for the maximum available tokens for a
            given model. Defaults to `inf`.
      description: Realtime session object configuration.
    RealtimeSessionCreateResponse:
