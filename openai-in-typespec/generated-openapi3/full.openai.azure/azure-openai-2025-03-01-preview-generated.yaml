      properties:
        type:
          type: string
          enum:
            - image_url
          description: The type of the content part.
        image_url:
          type: object
          properties:
            url:
              type: string
              format: uri
              description: Either a URL of the image or the base64 encoded image data.
            detail:
              type: string
              enum:
                - auto
                - low
                - high
              description: Specifies the detail level of the image. Learn more in the [Vision guide](/docs/guides/vision#low-or-high-fidelity-image-understanding).
              default: auto
          required:
            - url
      allOf:
        - $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessageContentPart'
      description: ''
    OpenAI.ChatCompletionRequestMessageContentPartRefusal:
      type: object
      required:
        - type
        - refusal
      properties:
        type:
          type: string
          enum:
            - refusal
          description: The type of the content part.
        refusal:
          type: string
          description: The refusal message generated by the model.
      allOf:
        - $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessageContentPart'
    OpenAI.ChatCompletionRequestMessageContentPartText:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
          description: The type of the content part.
        text:
          type: string
          description: The text content.
      allOf:
        - $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessageContentPart'
      description: ''
    OpenAI.ChatCompletionRequestMessageContentPartType:
      type: string
      enum:
        - text
        - file
        - input_audio
        - image_url
        - refusal
    OpenAI.ChatCompletionRequestSystemMessage:
      type: object
      required:
        - content
        - role
      properties:
        content:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/OpenAI.ChatCompletionRequestSystemMessageContentPart'
          description: The contents of the system message.
        role:
          type: string
          enum:
            - system
          description: The role of the messages author, in this case `system`.
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
      allOf:
        - $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessage'
      description: |-
        Developer-provided instructions that the model should follow, regardless of
        messages sent by the user. With o1 models and newer, use `developer` messages
        for this purpose instead.
    OpenAI.ChatCompletionRequestSystemMessageContentPart:
      type: object
      allOf:
        - $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessageContentPartText'
      x-oaiExpandable: true
    OpenAI.ChatCompletionRequestToolMessage:
      type: object
      required:
        - role
        - content
        - tool_call_id
      properties:
        role:
          type: string
          enum:
            - tool
          description: The role of the messages author, in this case `tool`.
        content:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/OpenAI.ChatCompletionRequestToolMessageContentPart'
          description: The contents of the tool message.
        tool_call_id:
          type: string
          description: Tool call that this message is responding to.
      allOf:
        - $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessage'
    OpenAI.ChatCompletionRequestToolMessageContentPart:
      type: object
      allOf:
        - $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessageContentPartText'
      x-oaiExpandable: true
    OpenAI.ChatCompletionRequestUserMessage:
      type: object
      required:
        - content
        - role
      properties:
        content:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/OpenAI.ChatCompletionRequestUserMessageContentPart'
          description: The contents of the user message.
          x-oaiExpandable: true
        role:
          type: string
          enum:
            - user
          description: The role of the messages author, in this case `user`.
        name:
          type: string
          description: An optional name for the participant. Provides the model information to differentiate between participants of the same role.
      allOf:
        - $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessage'
      description: |-
        Messages sent by an end user, containing prompts or additional context
        information.
    OpenAI.ChatCompletionRequestUserMessageContentPart:
      anyOf:
        - $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessageContentPartText'
        - $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessageContentPartImage'
        - $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessageContentPartAudio'
        - $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessageContentPartFile'
      x-oaiExpandable: true
    OpenAI.ChatCompletionResponseMessage:
      type: object
      required:
        - content
        - refusal
        - role
      properties:
        content:
          type: string
          nullable: true
          description: The contents of the message.
        refusal:
          type: string
          nullable: true
          description: The refusal message generated by the model.
        tool_calls:
          $ref: '#/components/schemas/ChatCompletionMessageToolCallsItem'
          readOnly: true
        annotations:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - url_citation
                description: The type of the URL citation. Always `url_citation`.
              url_citation:
                type: object
                properties:
                  end_index:
                    type: integer
                    format: int32
                    description: The index of the last character of the URL citation in the message.
                  start_index:
                    type: integer
                    format: int32
                    description: The index of the first character of the URL citation in the message.
                  url:
                    type: string
                    format: uri
                    description: The URL of the web resource.
                  title:
                    type: string
                    description: The title of the web resource.
                required:
                  - end_index
                  - start_index
                  - url
                  - title
                description: A URL citation when using web search.
            required:
              - type
              - url_citation
          description: |-
            Annotations for the message, when applicable, as when using the
            [web search tool](/docs/guides/tools-web-search?api-mode=chat).
        role:
          type: string
          enum:
            - assistant
          description: The role of the author of this message.
        function_call:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
          required:
            - name
            - arguments
          description: Deprecated and replaced by `tool_calls`. The name and arguments of a function that should be called, as generated by the model.
          deprecated: true
        audio:
          type: object
          properties:
            id:
              type: string
              description: Unique identifier for this audio response.
            expires_at:
              type: integer
              format: unixtime
              description: |-
                The Unix timestamp (in seconds) for when this audio response will
                no longer be accessible on the server for use in multi-turn
                conversations.
            data:
              type: string
              format: base64
              description: |-
                Base64 encoded audio bytes generated by the model, in the format
                specified in the request.
            transcript:
              type: string
              description: Transcript of the audio generated by the model.
          required:
            - id
            - expires_at
            - data
            - transcript
          nullable: true
          description: |-
            If the audio output modality is requested, this object contains data
            about the audio response from the model. [Learn more](/docs/guides/audio).
          x-oaiExpandable: true
      description: |-
        If the audio output modality is requested, this object contains data
        about the audio response from the model.
    OpenAI.ChatCompletionRole:
      type: string
      enum:
        - system
        - developer
        - user
        - assistant
        - tool
        - function
      description: The role of the author of a message
    OpenAI.ChatCompletionStreamOptions:
      type: object
      properties:
        include_usage:
          type: boolean
          description: |-
            If set, an additional chunk will be streamed before the `data: [DONE]`
            message. The `usage` field on this chunk shows the token usage statistics
            for the entire request, and the `choices` field will always be an empty
            array. 

            All other chunks will also include a `usage` field, but with a null
            value. **NOTE:** If the stream is interrupted, you may not receive the
            final usage chunk which contains the total token usage for the request.
      description: 'Options for streaming response. Only set this when you set `stream: true`.'
    OpenAI.ChatCompletionTokenLogprob:
      type: object
      required:
        - token
        - logprob
        - bytes
        - top_logprobs
      properties:
        token:
          type: string
          description: The token.
        logprob:
          type: number
          format: float
          description: The log probability of this token, if it is within the top 20 most likely tokens. Otherwise, the value `-9999.0` is used to signify that the token is very unlikely.
        bytes:
          type: array
          items:
            type: integer
            format: int32
          nullable: true
          description: A list of integers representing the UTF-8 bytes representation of the token. Useful in instances where characters are represented by multiple tokens and their byte representations must be combined to generate the correct text representation. Can be `null` if there is no bytes representation for the token.
        top_logprobs:
          type: array
          items:
            type: object
            properties:
              token:
                type: string
                description: The token.
              logprob:
                type: number
                format: float
                description: The log probability of this token, if it is within the top 20 most likely tokens. Otherwise, the value `-9999.0` is used to signify that the token is very unlikely.
              bytes:
                type: array
                items:
                  type: integer
                  format: int32
                nullable: true
                description: A list of integers representing the UTF-8 bytes representation of the token. Useful in instances where characters are represented by multiple tokens and their byte representations must be combined to generate the correct text representation. Can be `null` if there is no bytes representation for the token.
            required:
              - token
              - logprob
              - bytes
          description: List of the most likely tokens and their log probability, at this token position. In rare cases, there may be fewer than the number of requested `top_logprobs` returned.
    OpenAI.ChatCompletionTool:
      type: object
      required:
        - type
        - function
      properties:
        type:
          type: string
          enum:
            - function
          description: The type of the tool. Currently, only `function` is supported.
        function:
          $ref: '#/components/schemas/OpenAI.FunctionObject'
    OpenAI.ChatCompletionToolChoiceOption:
      anyOf:
        - type: string
          enum:
            - none
            - auto
            - required
        - $ref: '#/components/schemas/OpenAI.ChatCompletionNamedToolChoice'
      description: |-
        Controls which (if any) tool is called by the model.
        `none` means the model will not call any tool and instead generates a message.
        `auto` means the model can pick between generating a message or calling one or more tools.
        `required` means the model must call one or more tools.
        Specifying a particular tool via `{"type": "function", "function": {"name": "my_function"}}` forces the model to call that tool.

        `none` is the default when no tools are present. `auto` is the default if tools are present.
      x-oaiExpandable: true
    OpenAI.ChatOutputPrediction:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/OpenAI.ChatOutputPredictionType'
      discriminator:
        propertyName: type
        mapping:
          content: '#/components/schemas/OpenAI.ChatOutputPredictionContent'
      description: Base representation of predicted output from a model.
    OpenAI.ChatOutputPredictionContent:
      type: object
      required:
        - type
        - content
      properties:
        type:
          type: string
          enum:
            - content
          description: |-
            The type of the predicted content you want to provide. This type is
            currently always `content`.
        content:
          anyOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessageContentPartText'
          description: |-
            The content that should be matched when generating a model response.
            If generated tokens would match this content, the entire model response
            can be returned much more quickly.
          x-oaiExpandable: true
      allOf:
        - $ref: '#/components/schemas/OpenAI.ChatOutputPrediction'
      description: |-
        Static predicted output content, such as the content of a text file that is
        being regenerated.
    OpenAI.ChatOutputPredictionType:
      anyOf:
        - type: string
        - type: string
          enum:
            - content
    OpenAI.ChunkingStrategyResponseParam:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - static
            - other
      discriminator:
        propertyName: type
        mapping:
          other: '#/components/schemas/OpenAI.OtherChunkingStrategyResponseParam'
          static: '#/components/schemas/OpenAI.StaticChunkingStrategyResponseParam'
    OpenAI.ComparisonFilter:
      type: object
      required:
        - type
        - key
        - value
      properties:
        type:
          type: string
          enum:
            - eq
            - ne
            - gt
            - gte
            - lt
            - lte
          description: |-
            Specifies the comparison operator: `eq`, `ne`, `gt`, `gte`, `lt`, `lte`.
            - `eq`: equals
            - `ne`: not equal
            - `gt`: greater than
            - `gte`: greater than or equal
            - `lt`: less than
            - `lte`: less than or equal
          default: eq
        key:
          type: string
          description: The key to compare against the value.
        value:
          anyOf:
            - type: string
            - type: number
              format: float
            - type: boolean
          description: The value to compare against the attribute key; supports string, number, or boolean types.
      description: A filter used to compare a specified attribute key to a given value using a defined comparison operation.
    OpenAI.CompletionUsage:
      type: object
      required:
        - completion_tokens
        - prompt_tokens
        - total_tokens
      properties:
        completion_tokens:
          type: integer
          format: int32
          description: Number of tokens in the generated completion.
          default: 0
        prompt_tokens:
          type: integer
          format: int32
          description: Number of tokens in the prompt.
          default: 0
        total_tokens:
          type: integer
          format: int32
          description: Total number of tokens used in the request (prompt + completion).
          default: 0
        completion_tokens_details:
          type: object
          properties:
            accepted_prediction_tokens:
              type: integer
              format: int32
              description: |-
                When using Predicted Outputs, the number of tokens in the
                prediction that appeared in the completion.
              default: 0
            audio_tokens:
              type: integer
              format: int32
              description: Audio input tokens generated by the model.
              default: 0
            reasoning_tokens:
              type: integer
              format: int32
              description: Tokens generated by the model for reasoning.
              default: 0
            rejected_prediction_tokens:
              type: integer
              format: int32
              description: |-
                When using Predicted Outputs, the number of tokens in the
                prediction that did not appear in the completion. However, like
                reasoning tokens, these tokens are still counted in the total
                completion tokens for purposes of billing, output, and context window
                limits.
              default: 0
          description: Breakdown of tokens used in a completion.
        prompt_tokens_details:
          type: object
          properties:
            audio_tokens:
              type: integer
              format: int32
              description: Audio input tokens present in the prompt.
              default: 0
            cached_tokens:
              type: integer
              format: int32
              description: Cached tokens present in the prompt.
              default: 0
          description: Breakdown of tokens used in the prompt.
      description: Usage statistics for the completion request.
    OpenAI.CompoundFilter:
      type: object
      required:
        - type
        - filters
      properties:
        type:
          type: string
          enum:
            - and
            - or
          description: 'Type of operation: `and` or `or`.'
        filters:
          type: array
          items:
            anyOf:
              - $ref: '#/components/schemas/OpenAI.ComparisonFilter'
              - type: object
                additionalProperties: {}
          description: Array of filters to combine. Items can be `ComparisonFilter` or `CompoundFilter`.
      description: Combine multiple filters using `and` or `or`.
    OpenAI.ComputerAction:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/OpenAI.ComputerActionType'
      discriminator:
        propertyName: type
        mapping:
