        x:
          type: integer
          format: int32
          description: The x-coordinate where the scroll occurred.
        'y':
          type: integer
          format: int32
          description: The y-coordinate where the scroll occurred.
        scroll_x:
          type: integer
          format: int32
          description: The horizontal scroll distance.
        scroll_y:
          type: integer
          format: int32
          description: The vertical scroll distance.
      allOf:
        - $ref: '#/components/schemas/OpenAI.ComputerAction'
      description: A scroll action.
    OpenAI.ComputerActionType:
      type: string
      enum:
        - screenshot
        - click
        - double_click
        - scroll
        - type
        - wait
        - keypress
        - drag
        - move
    OpenAI.ComputerActionTypeKeys:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - type
          description: |-
            Specifies the event type. For a type action, this property is 
            always set to `type`.
        text:
          type: string
          description: The text to type.
      allOf:
        - $ref: '#/components/schemas/OpenAI.ComputerAction'
      description: An action to type in text.
    OpenAI.ComputerActionWait:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - wait
          description: |-
            Specifies the event type. For a wait action, this property is 
            always set to `wait`.
      allOf:
        - $ref: '#/components/schemas/OpenAI.ComputerAction'
      description: A wait action.
    OpenAI.ComputerTool:
      type: object
      required:
        - type
        - display_width
        - display_height
        - environment
      properties:
        type:
          type: string
          enum:
            - computer_use_preview
          description: The type of the computer use tool. Always `computer_use_preview`.
        display_width:
          type: number
          format: float
          description: The width of the computer display.
        display_height:
          type: number
          format: float
          description: The height of the computer display.
        environment:
          type: string
          enum:
            - mac
            - windows
            - ubuntu
            - browser
          description: The type of computer environment to control.
      allOf:
        - $ref: '#/components/schemas/OpenAI.Tool'
      description: |-
        A tool that controls a virtual computer. Learn more about the
        [computer tool](/docs/guides/tools-computer-use).
    OpenAI.ComputerToolCall:
      type: object
      required:
        - type
        - call_id
        - action
        - pending_safety_checks
      properties:
        type:
          type: string
          enum:
            - computer_call
          description: The type of the computer call. Always `computer_call`.
        call_id:
          type: string
          description: An identifier used when responding to the tool call with output.
        action:
          allOf:
            - $ref: '#/components/schemas/OpenAI.ComputerAction'
          x-oaiExpandable: true
        pending_safety_checks:
          type: array
          items:
            $ref: '#/components/schemas/OpenAI.ComputerToolCallSafetyCheck'
          description: The pending safety checks for the computer call.
          x-oaiExpandable: true
        status:
          type: string
          enum:
            - in_progress
            - completed
            - incomplete
          description: |-
            The status of the item. One of `in_progress`, `completed`, or
            `incomplete`. Populated when items are returned via API.
          readOnly: true
      allOf:
        - $ref: '#/components/schemas/OpenAI.Item'
      description: |-
        A tool call to a computer use tool. See the
        [computer use guide](/docs/guides/tools-computer-use) for more information.
    OpenAI.ComputerToolCallOutput:
      type: object
      required:
        - type
        - call_id
        - output
        - status
      properties:
        type:
          type: string
          enum:
            - computer_call_output
          description: The type of the computer tool call output. Always `computer_call_output`.
        call_id:
          type: string
          description: The ID of the computer tool call that produced the output.
        acknowledged_safety_checks:
          type: array
          items:
            $ref: '#/components/schemas/OpenAI.ComputerToolCallSafetyCheck'
          description: |-
            The safety checks reported by the API that have been acknowledged by the
            developer.
          x-oaiExpandable: true
        output:
          $ref: '#/components/schemas/OpenAI.ComputerToolCallOutputOutput'
        status:
          type: string
          enum:
            - in_progress
            - completed
            - incomplete
          description: |-
            The status of the message input. One of `in_progress`, `completed`, or
            `incomplete`. Populated when input items are returned via API.
          readOnly: true
      allOf:
        - $ref: '#/components/schemas/OpenAI.Item'
      description: The output of a computer tool call.
    OpenAI.ComputerToolCallOutputOutput:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/OpenAI.ComputerToolCallOutputOutputType'
      discriminator:
        propertyName: type
        mapping:
          computer_screenshot: '#/components/schemas/OpenAI.ComputerToolCallOutputOutputComputerScreenshot'
    OpenAI.ComputerToolCallOutputOutputComputerScreenshot:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - computer_screenshot
        image_url:
          type: string
        file_id:
          type: string
      allOf:
        - $ref: '#/components/schemas/OpenAI.ComputerToolCallOutputOutput'
    OpenAI.ComputerToolCallOutputOutputType:
      anyOf:
        - type: string
        - type: string
          enum:
            - computer_screenshot
      description: A computer screenshot image used with the computer use tool.
    OpenAI.ComputerToolCallSafetyCheck:
      type: object
      required:
        - id
        - code
        - message
      properties:
        id:
          type: string
          description: The ID of the pending safety check.
        code:
          type: string
          description: The type of the pending safety check.
        message:
          type: string
          description: Details about the pending safety check.
      description: A pending safety check for the computer call.
    OpenAI.Coordinate:
      type: object
      required:
        - x
        - 'y'
      properties:
        x:
          type: integer
          format: int32
          description: The x-coordinate.
        'y':
          type: integer
          format: int32
          description: The y-coordinate.
      description: 'An x/y coordinate pair, e.g. `{ x: 100, y: 200 }`.'
    OpenAI.CreateImageRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: A text description of the desired image(s). The maximum length is 1000 characters for `dall-e-2` and 4000 characters for `dall-e-3`.
        model:
          anyOf:
            - type: string
            - type: string
              enum:
                - dall-e-2
                - dall-e-3
          nullable: true
          description: The model to use for image generation.
          x-oaiTypeLabel: string
          default: dall-e-2
        'n':
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 10
          description: The number of images to generate. Must be between 1 and 10. For `dall-e-3`, only `n=1` is supported.
          default: 1
        quality:
          type: string
          enum:
            - standard
            - hd
          description: The quality of the image that will be generated. `hd` creates images with finer details and greater consistency across the image. This param is only supported for `dall-e-3`.
          default: standard
        response_format:
          type: string
          enum:
            - url
            - b64_json
          nullable: true
          description: The format in which the generated images are returned. Must be one of `url` or `b64_json`. URLs are only valid for 60 minutes after the image has been generated.
          default: url
        size:
          type: string
          enum:
            - 256x256
            - 512x512
            - 1024x1024
            - 1792x1024
            - 1024x1792
          nullable: true
          description: The size of the generated images. Must be one of `256x256`, `512x512`, or `1024x1024` for `dall-e-2`. Must be one of `1024x1024`, `1792x1024`, or `1024x1792` for `dall-e-3` models.
          default: 1024x1024
        style:
          type: string
          enum:
            - vivid
            - natural
          nullable: true
          description: The style of the generated images. Must be one of `vivid` or `natural`. Vivid causes the model to lean towards generating hyper-real and dramatic images. Natural causes the model to produce more natural, less hyper-real looking images. This param is only supported for `dall-e-3`.
          default: vivid
        user:
          type: string
          description: A unique identifier representing your end-user, which can help OpenAI to monitor and detect abuse.
    OpenAI.CreateMessageRequest:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
            - assistant
          description: |-
            The role of the entity that is creating the message. Allowed values include:
            - `user`: Indicates the message is sent by an actual user and should be used in most cases to represent user-generated messages.
            - `assistant`: Indicates the message is generated by the assistant. Use this value to insert messages from the assistant into the conversation.
        content:
          type: array
          items:
            $ref: '#/components/schemas/OpenAI.MessageContent'
          x-oaiExpandable: true
        attachments:
          type: array
          items:
            type: object
            properties:
              file_id:
                type: string
                description: The ID of the file to attach to the message.
              tools:
                type: array
                items:
                  anyOf:
                    - $ref: '#/components/schemas/OpenAI.AssistantToolsCode'
                    - $ref: '#/components/schemas/OpenAI.AssistantToolsFileSearchTypeOnly'
                description: The tools to add this file to.
            required:
              - file_id
              - tools
          nullable: true
          description: A list of files attached to the message, and the tools they should be added to.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: |-
            Set of 16 key-value pairs that can be attached to an object. This can be
            useful for storing additional information about the object in a structured
            format, and querying for objects via API or the dashboard.

            Keys are strings with a maximum length of 64 characters. Values are strings
            with a maximum length of 512 characters.
          x-oaiTypeLabel: map
    OpenAI.CreateResponse:
      type: object
      required:
        - input
      properties:
        metadata:
          type: object
          additionalProperties:
            type: string
          description: |-
            Set of 16 key-value pairs that can be attached to an object. This can be
            useful for storing additional information about the object in a structured
            format, and querying for objects via API or the dashboard.

            Keys are strings with a maximum length of 64 characters. Values are strings
            with a maximum length of 512 characters.
          x-oaiTypeLabel: map
        temperature:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 2
          description: |-
            What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.
            We generally recommend altering this or `top_p` but not both.
          default: 1
        top_p:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: |-
            An alternative to sampling with temperature, called nucleus sampling,
            where the model considers the results of the tokens with top_p probability
            mass. So 0.1 means only the tokens comprising the top 10% probability mass
            are considered.

            We generally recommend altering this or `temperature` but not both.
          default: 1
        user:
          type: string
          description: A unique identifier representing your end-user, which can help OpenAI to monitor and detect abuse. [Learn more](/docs/guides/safety-best-practices#end-user-ids).
        previous_response_id:
          type: string
          nullable: true
          description: |-
            The unique ID of the previous response to the model. Use this to
            create multi-turn conversations. Learn more about
            [conversation state](/docs/guides/conversation-state).
        model:
          allOf:
            - $ref: '#/components/schemas/OpenAI.ModelIdsResponses'
          description: |-
            Model ID used to generate the response, like `gpt-4o` or `o1`. OpenAI
            offers a wide range of models with different capabilities, performance
            characteristics, and price points. Refer to the [model guide](/docs/models)
            to browse and compare available models.
        reasoning:
          type: object
          allOf:
            - $ref: '#/components/schemas/OpenAI.Reasoning'
          nullable: true
        max_output_tokens:
          type: integer
          format: int32
          nullable: true
          description: An upper bound for the number of tokens that can be generated for a response, including visible output tokens and [reasoning tokens](/docs/guides/reasoning).
        instructions:
          type: string
          nullable: true
          description: |-
            Inserts a system (or developer) message as the first item in the model's context.

            When using along with `previous_response_id`, the instructions from a previous
            response will be not be carried over to the next response. This makes it simple
            to swap out system (or developer) messages in new responses.
        text:
          type: object
          properties:
            format:
              $ref: '#/components/schemas/OpenAI.ResponseTextFormatConfiguration'
          description: |-
            Configuration options for a text response from the model. Can be plain
            text or structured JSON data. Learn more:
            - [Text inputs and outputs](/docs/guides/text)
            - [Structured Outputs](/docs/guides/structured-outputs)
        tools:
          type: array
          items:
            $ref: '#/components/schemas/OpenAI.Tool'
          description: |-
            An array of tools the model may call while generating a response. You 
            can specify which tool to use by setting the `tool_choice` parameter.

            The two categories of tools you can provide the model are:

            - **Built-in tools**: Tools that are provided by OpenAI that extend the
              model's capabilities, like [web search](/docs/guides/tools-web-search)
              or [file search](/docs/guides/tools-file-search). Learn more about
              [built-in tools](/docs/guides/tools).
            - **Function calls (custom tools)**: Functions that are defined by you,
              enabling the model to call your own code. Learn more about
              [function calling](/docs/guides/function-calling).
        tool_choice:
          anyOf:
            - $ref: '#/components/schemas/OpenAI.ToolChoiceOptions'
            - $ref: '#/components/schemas/OpenAI.ToolChoiceObject'
          description: |-
            How the model should select which tool (or tools) to use when generating
            a response. See the `tools` parameter to see how to specify which tools
            the model can call.
          x-oaiExpandable: true
        truncation:
          type: string
          enum:
            - auto
            - disabled
          nullable: true
          description: |-
            The truncation strategy to use for the model response.
            - `auto`: If the context of this response and previous ones exceeds
              the model's context window size, the model will truncate the 
              response to fit the context window by dropping input items in the
              middle of the conversation. 
            - `disabled` (default): If a model response will exceed the context window 
              size for a model, the request will fail with a 400 error.
          default: disabled
        input:
          anyOf:
            - type: string
            - type: array
              items:
                anyOf:
                  - $ref: '#/components/schemas/OpenAI.ImplicitUserMessage'
                  - $ref: '#/components/schemas/OpenAI.Item'
          description: |-
            Text, image, or file inputs to the model, used to generate a response.

            Learn more:
            - [Text inputs and outputs](/docs/guides/text)
            - [Image inputs](/docs/guides/images)
            - [File inputs](/docs/guides/pdf-files)
            - [Conversation state](/docs/guides/conversation-state)
            - [Function calling](/docs/guides/function-calling)
          x-oaiExpandable: true
        include:
          type: array
          items:
            $ref: '#/components/schemas/OpenAI.Includable'
          nullable: true
          description: |-
            Specify additional output data to include in the model response. Currently
            supported values are:
            - `file_search_call.results`: Include the search results of
              the file search tool call.
            - `message.input_image.image_url`: Include image urls from the input message.
            - `computer_call_output.output.image_url`: Include image urls from the computer call output.
        parallel_tool_calls:
          type: boolean
          nullable: true
          description: Whether to allow the model to run tool calls in parallel.
          default: true
        store:
          type: boolean
          nullable: true
          description: |-
            Whether to store the generated model response for later retrieval via
            API.
          default: true
        stream:
          type: boolean
          nullable: true
          description: |-
            If set to true, the model response data will be streamed to the client
            as it is generated using [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format).
            See the [Streaming section below](/docs/api-reference/responses-streaming)
            for more information.
          default: false
    OpenAI.DeleteFileResponse:
      type: object
      required:
        - id
        - object
        - deleted
      properties:
        id:
          type: string
        object:
          type: string
          enum:
            - file
        deleted:
          type: boolean
    OpenAI.Error:
      type: object
      required:
        - code
        - message
        - param
        - type
      properties:
        code:
          type: string
          nullable: true
        message:
          type: string
        param:
          type: string
          nullable: true
        type:
          type: string
    OpenAI.ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/OpenAI.Error'
    OpenAI.FileSearchRanker:
      type: string
      enum:
        - auto
        - default_2024_08_21
      description: The ranker to use for the file search. If not specified will use the `auto` ranker.
    OpenAI.FileSearchRankingOptions:
      type: object
      required:
        - score_threshold
      properties:
        ranker:
          $ref: '#/components/schemas/OpenAI.FileSearchRanker'
        score_threshold:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: The score threshold for the file search. All values must be a floating point number between 0 and 1.
      description: |-
        The ranking options for the file search. If not specified, the file search tool will use the `auto` ranker and a score_threshold of 0.

        See the [file search tool documentation](/docs/assistants/tools/file-search#customizing-file-search-settings) for more information.
    OpenAI.FileSearchTool:
      type: object
      required:
        - type
        - vector_store_ids
      properties:
        type:
          type: string
          enum:
            - file_search
          description: The type of the file search tool. Always `file_search`.
        vector_store_ids:
          type: array
          items:
            type: string
          description: The IDs of the vector stores to search.
        max_num_results:
          type: integer
          format: int32
          description: |-
            The maximum number of results to return. This number should be between 1
            and 50 inclusive.
        filters:
          anyOf:
            - $ref: '#/components/schemas/OpenAI.ComparisonFilter'
            - $ref: '#/components/schemas/OpenAI.CompoundFilter'
          description: A filter to apply based on file attributes.
          x-oaiExpandable: true
        ranking_options:
          type: object
          properties:
            ranker:
              type: string
              enum:
                - auto
                - default-2024-11-15
              description: The ranker to use for the file search.
              default: auto
            score_threshold:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: |-
                The score threshold for the file search, a number between 0 and 1.
                Numbers closer to 1 will attempt to return only the most relevant
                results, but may return fewer results.
              default: 0
          description: Ranking options for search.
      allOf:
        - $ref: '#/components/schemas/OpenAI.Tool'
      description: |-
        A tool that searches for relevant content from uploaded files.
        Learn more about the [file search tool](/docs/guides/tools-file-search).
    OpenAI.FileSearchToolCall:
      type: object
      required:
        - type
        - queries
      properties:
        type:
          type: string
          enum:
            - file_search_call
          description: The type of the file search tool call. Always `file_search_call`.
        status:
          type: string
          enum:
            - in_progress
            - searching
            - completed
            - incomplete
            - failed
          description: |-
            The status of the file search tool call. One of `in_progress`, 
            `searching`, `incomplete` or `failed`,
          readOnly: true
        queries:
          type: array
          items:
            type: string
          description: The queries used to search for files.
        results:
          type: array
          items:
            type: object
            properties:
              file_id:
                type: string
                description: The unique ID of the file.
              text:
                type: string
                description: The text that was retrieved from the file.
              filename:
                type: string
                description: The name of the file.
              attributes:
                $ref: '#/components/schemas/OpenAI.VectorStoreFileAttributes'
              score:
                type: number
                format: float
                description: The relevance score of the file - a value between 0 and 1.
          nullable: true
          description: The results of the file search tool call.
      allOf:
        - $ref: '#/components/schemas/OpenAI.Item'
      description: |-
        The results of a file search tool call. See the
        [file search guide](/docs/guides/tools-file-search) for more information.
    OpenAI.FunctionObject:
      type: object
      required:
        - name
      properties:
        description:
          type: string
          description: A description of what the function does, used by the model to choose when and how to call the function.
        name:
          type: string
          description: The name of the function to be called. Must be a-z, A-Z, 0-9, or contain underscores and dashes, with a maximum length of 64.
        parameters:
          description: |-
            The parameters the functions accepts, described as a JSON Schema object. See the [guide](/docs/guides/function-calling) for examples, and the [JSON Schema reference](https://json-schema.org/understanding-json-schema/) for documentation about the format.

            Omitting `parameters` defines a function with an empty parameter list.
        strict:
          type: boolean
          nullable: true
          description: Whether to enable strict schema adherence when generating the function call. If set to true, the model will follow the exact schema defined in the `parameters` field. Only a subset of JSON Schema is supported when `strict` is `true`. Learn more about Structured Outputs in the [function calling guide](docs/guides/function-calling).
          default: false
    OpenAI.FunctionTool:
      type: object
      required:
        - type
        - name
        - parameters
        - strict
      properties:
        type:
          type: string
          enum:
            - function
          description: The type of the function tool. Always `function`.
        name:
          type: string
          description: The name of the function to call.
        description:
          type: string
          nullable: true
          description: |-
            A description of the function. Used by the model to determine whether
            or not to call the function.
        parameters:
          type: object
          additionalProperties: {}
          description: A JSON schema object describing the parameters of the function.
        strict:
          type: boolean
          description: Whether to enforce strict parameter validation. Default `true`.
      allOf:
        - $ref: '#/components/schemas/OpenAI.Tool'
      description: |-
        Defines a function in your own code the model can choose to call. Learn more
        about [function calling](/docs/guides/function-calling).
    OpenAI.FunctionToolCall:
      type: object
      required:
        - type
        - call_id
        - name
        - arguments
        - status
      properties:
        type:
          type: string
          enum:
            - function_call
          description: The type of the function tool call. Always `function_call`.
        call_id:
          type: string
          description: The unique ID of the function tool call generated by the model.
        name:
          type: string
          description: The name of the function to run.
        arguments:
          type: string
          description: A JSON string of the arguments to pass to the function.
        status:
          type: string
          enum:
            - in_progress
            - completed
            - incomplete
          description: |-
            The status of the item. One of `in_progress`, `completed`, or
            `incomplete`. Populated when items are returned via API.
          readOnly: true
      allOf:
        - $ref: '#/components/schemas/OpenAI.Item'
      description: |-
        A tool call to run a function. See the
        [function calling guide](/docs/guides/function-calling) for more information.
    OpenAI.FunctionToolCallOutput:
      type: object
      required:
        - type
        - call_id
        - output
        - status
      properties:
        type:
          type: string
          enum:
            - function_call_output
          description: The type of the function tool call output. Always `function_call_output`.
        call_id:
          type: string
          description: The unique ID of the function tool call generated by the model.
        output:
          type: string
          description: A JSON string of the output of the function tool call.
        status:
          type: string
          enum:
            - in_progress
            - completed
            - incomplete
          description: |-
            The status of the item. One of `in_progress`, `completed`, or
            `incomplete`. Populated when items are returned via API.
          readOnly: true
      allOf:
        - $ref: '#/components/schemas/OpenAI.Item'
      description: The output of a function tool call.
    OpenAI.Image:
      type: object
      properties:
        b64_json:
          type: string
