openapi: 3.0.0
info:
  title: Azure OpenAI Service
  version: 2025-03-01-preview
tags:
  - name: Audio
  - name: Chat
  - name: Completions
  - name: Files
  - name: Images
  - name: Assistants
  - name: VectorStores
paths:
  /deployments/{deployment_id}/audio/speech:
    post:
      operationId: Speech_Create
      summary: Generates text-to-speech audio from the input text.
      parameters:
        - name: deployment_id
          in: path
          required: true
          description: Deployment ID of the model to use with this operation.
          schema:
            type: string
        - name: api-version
          in: query
          required: true
          description: The Azure OpenAI Service API version to use for this operation.
          schema:
            $ref: '#/components/schemas/AzureOpenAIServiceApiVersion'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      tags:
        - Audio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AzureCreateSpeechRequestMultiPart'
  /deployments/{deployment_id}/audio/transcriptions:
    post:
      operationId: AzureAudioTranscription_Transcriptions_Create
      summary: Transcribes audio into the input language.
      parameters:
        - name: deployment_id
          in: path
          required: true
          description: Deployment ID of the model to use with this operation.
          schema:
            type: string
        - name: api-version
          in: query
          required: true
          description: The Azure OpenAI Service API version to use for this operation.
          schema:
            $ref: '#/components/schemas/AzureOpenAIServiceApiVersion'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureAudioTranscriptionResponse'
            text/plain:
              schema:
                type: string
      tags:
        - Audio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AzureCreateTranscriptionRequestMultiPart'
  /deployments/{deployment_id}/audio/translations:
    post:
      operationId: Translations_Create
      summary: Gets English language transcribed text and associated metadata from provided spoken audio data.
      parameters:
        - name: deployment_id
          in: path
          required: true
          description: Deployment ID of the model to use with this operation.
          schema:
            type: string
        - name: api-version
          in: query
          required: true
          description: The Azure OpenAI Service API version to use for this operation.
          schema:
            $ref: '#/components/schemas/AzureOpenAIServiceApiVersion'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureAudioTranslationResponse'
            text/plain:
              schema:
                type: string
      tags:
        - Audio
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AzureCreateTranslationRequestMultiPart'
  /deployments/{deployment_id}/chat/completions:
    post:
      operationId: ChatCompletions_Create
      summary: Creates a completion for the chat message
      parameters:
        - name: deployment_id
          in: path
          required: true
          description: Deployment ID of the model to use with this operation.
          schema:
            type: string
        - name: api-version
          in: query
          required: true
          description: The Azure OpenAI Service API version to use for this operation.
          schema:
            $ref: '#/components/schemas/AzureOpenAIServiceApiVersion'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/AzureCreateChatCompletionResponse'
                  - type: array
                    items:
                      $ref: '#/components/schemas/AzureChatCompletionStreamResponseDelta'
                  - $ref: '#/components/schemas/AzureOpenAIChatErrorResponse'
      tags:
        - Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AzureCreateChatCompletionRequest'
      x-ms-examples:
        Create a chat completion:
          $ref: ./examples/chat_completions.yaml
  /deployments/{deployment_id}/completions:
    post:
      operationId: Completions_Create
      summary: Creates a completion for the provided prompt, parameters and chosen model.
      parameters:
        - name: deployment_id
          in: path
          required: true
          description: Deployment ID of the model to use with this operation.
          schema:
            type: string
        - name: api-version
          in: query
          required: true
          description: The Azure OpenAI Service API version to use for this operation.
          schema:
            $ref: '#/components/schemas/AzureOpenAIServiceApiVersion'
      responses:
        '200':
          description: The request has succeeded.
          headers:
            apim-request-id:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/AzureCreateCompletionResponse'
                  - $ref: '#/components/schemas/AzureOpenAICompletionErrorResponse'
      tags:
        - Completions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AzureCreateCompletionRequest'
      x-ms-examples:
        Create a chat completion:
          $ref: ./examples/completions.yaml
  /deployments/{deployment_id}/images/generations:
    post:
      operationId: ImageGenerations_Create
      parameters:
        - name: deployment_id
          in: path
          required: true
          description: Deployment ID of the model to use with this operation.
          schema:
            type: string
        - name: api-version
          in: query
          required: true
          description: The Azure OpenAI Service API version to use for this operation.
          schema:
            $ref: '#/components/schemas/AzureOpenAIServiceApiVersion'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/OpenAI.ImagesResponse'
                  - $ref: '#/components/schemas/AzureOpenAIDalleErrorResponse'
      tags:
        - Images
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAI.CreateImageRequest'
  /files:
    post:
      operationId: createFile
      summary: |-
        Upload a file that can be used across various endpoints. The size of all the files uploaded by
        one organization can be up to 100 GB.

        The size of individual files can be a maximum of 512 MB or 2 million tokens for Assistants. See
        the [Assistants Tools guide](/docs/assistants/tools) to learn more about the types of files
        supported. The Fine-tuning API only supports `.jsonl` files.

        Please [contact us](https://help.openai.com/) if you need to increase these storage limits.
      parameters:
        - name: accept
          in: header
          required: true
          schema:
            type: string
            enum:
              - application/json
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureOpenAIFile'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.ErrorResponse'
      tags:
        - Files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AzureCreateFileRequestMultiPart'
    get:
      operationId: listFiles
      summary: Returns a list of files that belong to the user's organization.
      parameters:
        - name: accept
          in: header
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: purpose
          in: query
          required: false
          description: Only return files with the given purpose.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureListFilesResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.ErrorResponse'
      tags:
        - Files
  /files/{file_id}:
    get:
      operationId: retrieveFile
      summary: Returns information about a specific file.
      parameters:
        - name: accept
          in: header
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: file_id
          in: path
          required: true
          description: The ID of the file to use for this request.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AzureOpenAIFile'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.ErrorResponse'
      tags:
        - Files
    delete:
      operationId: deleteFile
      summary: Delete a file
      parameters:
        - name: accept
          in: header
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: file_id
          in: path
          required: true
          description: The ID of the file to use for this request.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.DeleteFileResponse'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.ErrorResponse'
      tags:
        - Files
  /files/{file_id}/content:
    get:
      operationId: downloadFile
      summary: Returns the contents of the specified file.
      parameters:
        - name: accept
          in: header
          required: true
          schema:
            type: string
            enum:
              - application/json
        - name: file_id
          in: path
          required: true
          description: The ID of the file to use for this request.
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: string
                format: byte
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.ErrorResponse'
      tags:
        - Files
  /responses:
    post:
      operationId: createResponse
      description: Creates a model response.
      parameters:
        - name: accept
          in: header
          required: true
          schema:
            type: string
            enum:
              - application/json
              - text/event-stream
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                anyOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/OpenAI.ResponseStreamEvent'
                  - $ref: '#/components/schemas/OpenAI.Response'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.ResponseErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAI.CreateResponse'
  /responses/{response_id}:
    get:
      operationId: getResponse
      description: Retrieves a model response with the given ID.
      parameters:
        - name: response_id
          in: path
          required: true
          description: The ID of the response to retrieve.
          schema:
            type: string
        - name: include[]
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OpenAI.Includable'
            default: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.Response'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.ResponseErrorResponse'
    delete:
      operationId: deleteResponse
      description: Deletes a response by ID.
      parameters:
        - name: response_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - response.deleted
                  id:
                    type: string
                  deleted:
                    type: boolean
                    enum:
                      - true
                required:
                  - object
                  - id
                  - deleted
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.ResponseErrorResponse'
  /responses/{response_id}/input_items:
    get:
      operationId: listInputItems
      description: Returns a list of input items for a given response.
      parameters:
        - name: response_id
          in: path
          required: true
          description: The ID of the response to retrieve.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: |-
            A limit on the number of objects to be returned. Limit can range between 1 and 100, and the
            default is 20.
          schema:
            type: integer
            format: int32
            default: 20
          explode: false
        - name: order
          in: query
          required: false
          description: |-
            Sort order by the `created_at` timestamp of the objects. `asc` for ascending order and`desc`
            for descending order.
          schema:
            type: string
            enum:
              - asc
              - desc
          explode: false
        - name: after
          in: query
          required: false
          description: |-
            A cursor for use in pagination. `after` is an object ID that defines your place in the list.
            For instance, if you make a list request and receive 100 objects, ending with obj_foo, your
            subsequent call can include after=obj_foo in order to fetch the next page of the list.
          schema:
            type: string
          explode: false
        - name: before
          in: query
          required: false
          description: |-
            A cursor for use in pagination. `before` is an object ID that defines your place in the list.
            For instance, if you make a list request and receive 100 objects, ending with obj_foo, your
            subsequent call can include before=obj_foo in order to fetch the previous page of the list.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.ResponseItemList'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.ResponseErrorResponse'
  /threads/{thread_id}/messages:
    post:
      operationId: createMessage
      summary: Create a message.
      parameters:
        - name: thread_id
          in: path
          required: true
          description: The ID of the [thread](/docs/api-reference/threads) to create a message for.
          schema:
            type: string
        - name: api-version
          in: query
          required: true
          description: The Azure OpenAI Service API version to use for this operation.
          schema:
            $ref: '#/components/schemas/AzureOpenAIServiceApiVersion'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.MessageObject'
        default:
          description: An unexpected error response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.ErrorResponse'
      tags:
        - Assistants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAI.CreateMessageRequest'
  /vector_stores/{vector_store_id}/files/{file_id}:
    post:
      operationId: updateVectorStoreFileAttributes
      parameters:
        - name: api-version
          in: query
          required: true
          description: The Azure OpenAI Service API version to use for this operation.
          schema:
            $ref: '#/components/schemas/AzureOpenAIServiceApiVersion'
        - name: vector_store_id
          in: path
          required: true
          schema:
            type: string
        - name: file_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAI.VectorStoreFileObject'
      tags:
        - VectorStores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAI.UpdateVectorStoreFileAttributesRequest'
security:
  - ApiKeyAuth: []
  - OAuth2Auth:
      - https://cognitiveservices.azure.com/.default
components:
  schemas:
    AudioTaskLabel:
      anyOf:
        - type: string
        - type: string
          enum:
            - transcribe
            - translate
      description: Defines the possible descriptors for available audio operation responses.
    AudioTranslationSegment:
      type: object
      required:
        - id
        - start
        - end
        - text
        - temperature
        - avg_logprob
        - compression_ratio
        - no_speech_prob
        - tokens
        - seek
      properties:
        id:
          type: integer
          format: int32
          description: The 0-based index of this segment within a translation.
        start:
          type: number
          format: float
          description: The time at which this segment started relative to the beginning of the translated audio.
        end:
          type: number
          format: float
          description: The time at which this segment ended relative to the beginning of the translated audio.
        text:
          type: string
          description: The translated text that was part of this audio segment.
        temperature:
          type: number
          format: float
          description: The temperature score associated with this audio segment.
        avg_logprob:
          type: number
          format: float
          description: The average log probability associated with this audio segment.
        compression_ratio:
          type: number
          format: float
          description: The compression ratio of this audio segment.
        no_speech_prob:
          type: number
          format: float
          description: The probability of no speech detection within this audio segment.
        tokens:
          type: array
          items:
            type: integer
            format: int32
          description: The token IDs matching the translated text in this audio segment.
        seek:
          type: integer
          format: int32
          description: |-
            The seek position associated with the processing of this audio segment.
            Seek positions are expressed as hundredths of seconds.
            The model may process several segments from a single seek position, so while the seek position will never represent
            a later time than the segment's start, the segment's start may represent a significantly later time than the
            segment's associated seek position.
      description: |-
        Extended information about a single segment of translated audio data.
        Segments generally represent roughly 5-10 seconds of speech. Segment boundaries typically occur between words but not
        necessarily sentences.
    AzureAudioTranscriptionResponse:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: The transcribed text for the provided audio data.
        task:
          allOf:
            - $ref: '#/components/schemas/AudioTaskLabel'
          description: The label that describes which operation type generated the accompanying response data.
        language:
          type: string
          description: |-
            The spoken language that was detected in the transcribed audio data.
            This is expressed as a two-letter ISO-639-1 language code like 'en' or 'fr'.
        duration:
          type: number
          format: float
          description: The total duration of the audio processed to produce accompanying transcription information.
        segments:
          type: array
          items:
            $ref: '#/components/schemas/OpenAI.TranscriptionSegment'
          description: A collection of information about the timing, probabilities, and other detail of each processed audio segment.
        words:
          type: array
          items:
            $ref: '#/components/schemas/OpenAI.TranscriptionWord'
          description: A collection of information about the timing of each processed word.
      description: Result information for an operation that transcribed spoken audio into written text.
    AzureAudioTranslationResponse:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: The translated text for the provided audio data.
        task:
          allOf:
            - $ref: '#/components/schemas/AudioTaskLabel'
          description: The label that describes which operation type generated the accompanying response data.
        language:
          type: string
          description: |-
            The spoken language that was detected in the translated audio data.
            This is expressed as a two-letter ISO-639-1 language code like 'en' or 'fr'.
        duration:
          type: number
          format: float
          description: The total duration of the audio processed to produce accompanying translation information.
        segments:
          type: array
          items:
            $ref: '#/components/schemas/AudioTranslationSegment'
          description: A collection of information about the timing, probabilities, and other detail of each processed audio segment.
      description: Result information for an operation that translated spoken audio into written text.
    AzureChatCompletionStreamResponseDelta:
      type: object
      properties:
        audio:
          allOf:
            - $ref: '#/components/schemas/OpenAI.ChatCompletionMessageAudioChunk'
          description: Response audio associated with the streaming chat delta payload.
        content:
          type: string
          nullable: true
          description: The contents of the chunk message.
        function_call:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
          description: Deprecated and replaced by `tool_calls`. The name and arguments of a function that should be called, as generated by the model.
          deprecated: true
        tool_calls:
          type: array
          items:
            $ref: '#/components/schemas/OpenAI.ChatCompletionMessageToolCallChunk'
          readOnly: true
        role:
          allOf:
            - $ref: '#/components/schemas/OpenAI.ChatCompletionRole'
          description: The role of the author of this message.
        refusal:
          type: string
          nullable: true
          description: The refusal message generated by the model.
        context:
          allOf:
            - $ref: '#/components/schemas/AzureChatMessageContext'
          description: The Azure-specific context information associated with the chat completion response message.
      description: |-
        The extended response model for a streaming chat response message on the Azure OpenAI service.
        This model adds support for chat message context, used by the On Your Data feature for intent, citations, and other
        information related to retrieval-augmented generation performed.
    AzureChatDataSource:
      type: object
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/AzureChatDataSourceType'
          description: The differentiating type identifier for the data source.
      discriminator:
        propertyName: type
        mapping:
          azure_search: '#/components/schemas/AzureSearchChatDataSource'
          azure_cosmos_db: '#/components/schemas/AzureCosmosDBChatDataSource'
          elasticsearch: '#/components/schemas/ElasticsearchChatDataSource'
          pinecone: '#/components/schemas/PineconeChatDataSource'
          mongo_db: '#/components/schemas/MongoDBChatDataSource'
      description: |-
        A representation of configuration data for a single Azure OpenAI chat data source.
        This will be used by a chat completions request that should use Azure OpenAI chat extensions to augment the
        response behavior.
        The use of this configuration is compatible only with Azure OpenAI.
    AzureChatDataSourceAccessTokenAuthenticationOptions:
      type: object
      required:
        - type
        - access_token
      properties:
        type:
          type: string
          enum:
            - access_token
        access_token:
          type: string
      allOf:
        - $ref: '#/components/schemas/AzureChatDataSourceAuthenticationOptions'
    AzureChatDataSourceApiKeyAuthenticationOptions:
      type: object
      required:
        - type
        - key
      properties:
        type:
          type: string
          enum:
            - api_key
        key:
          type: string
      allOf:
        - $ref: '#/components/schemas/AzureChatDataSourceAuthenticationOptions'
    AzureChatDataSourceAuthenticationOptions:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/AzureChatDataSourceAuthenticationOptionsType'
      discriminator:
        propertyName: type
        mapping:
          username_and_password: '#/components/schemas/AzureChatDataSourceUsernameAndPasswordAuthenticationOptions'
          connection_string: '#/components/schemas/AzureChatDataSourceConnectionStringAuthenticationOptions'
          key_and_key_id: '#/components/schemas/AzureChatDataSourceKeyAndKeyIdAuthenticationOptions'
          encoded_api_key: '#/components/schemas/AzureChatDataSourceEncodedApiKeyAuthenticationOptions'
          access_token: '#/components/schemas/AzureChatDataSourceAccessTokenAuthenticationOptions'
          system_assigned_managed_identity: '#/components/schemas/AzureChatDataSourceSystemAssignedManagedIdentityAuthenticationOptions'
          user_assigned_managed_identity: '#/components/schemas/AzureChatDataSourceUserAssignedManagedIdentityAuthenticationOptions'
    AzureChatDataSourceAuthenticationOptionsType:
      type: string
      enum:
        - api_key
        - username_and_password
        - connection_string
        - key_and_key_id
        - encoded_api_key
        - access_token
        - system_assigned_managed_identity
        - user_assigned_managed_identity
    AzureChatDataSourceConnectionStringAuthenticationOptions:
      type: object
      required:
        - type
        - connection_string
      properties:
        type:
          type: string
          enum:
            - connection_string
        connection_string:
          type: string
      allOf:
        - $ref: '#/components/schemas/AzureChatDataSourceAuthenticationOptions'
    AzureChatDataSourceDeploymentNameVectorizationSource:
      type: object
      required:
        - type
        - deployment_name
      properties:
        type:
          type: string
          enum:
            - deployment_name
          description: The type identifier, always 'deployment_name' for this vectorization source type.
        deployment_name:
          type: string
          description: |-
            The embedding model deployment to use for vectorization. This deployment must exist within the same Azure OpenAI
            resource as the model deployment being used for chat completions.
        dimensions:
          type: integer
          format: int32
          description: |-
            The number of dimensions to request on embeddings.
            Only supported in 'text-embedding-3' and later models.
      allOf:
