              items:
                type: string
            top_logprobs:
              type: array
              items:
                type: object
                additionalProperties:
                  type: number
                  format: float
          nullable: true
        text:
          type: string
        content_filter_results:
          $ref: '#/components/schemas/AzureContentFilterResultForChoice'
