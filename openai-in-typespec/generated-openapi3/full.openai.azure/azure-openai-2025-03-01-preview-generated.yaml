              { x: 100, y: 200 },
              { x: 200, y: 300 }
            ]
            ```
          x-oaiExpandable: true
      allOf:
        - $ref: '#/components/schemas/OpenAI.ComputerAction'
      description: A drag action.
    OpenAI.ComputerActionKeyPress:
      type: object
      required:
        - type
        - keys
      properties:
        type:
          type: string
          enum:
            - keypress
          description: |-
            Specifies the event type. For a keypress action, this property is 
            always set to `keypress`.
        keys:
          type: array
          items:
            type: string
          description: |-
            The combination of keys the model is requesting to be pressed. This is an
            array of strings, each representing a key.
      allOf:
        - $ref: '#/components/schemas/OpenAI.ComputerAction'
      description: A collection of keypresses the model would like to perform.
    OpenAI.ComputerActionMove:
      type: object
      required:
        - type
        - x
        - 'y'
      properties:
        type:
          type: string
          enum:
            - move
          description: |-
            Specifies the event type. For a move action, this property is 
            always set to `move`.
        x:
          type: integer
          format: int32
          description: The x-coordinate to move to.
        'y':
          type: integer
          format: int32
          description: The y-coordinate to move to.
      allOf:
        - $ref: '#/components/schemas/OpenAI.ComputerAction'
      description: A mouse move action.
    OpenAI.ComputerActionScreenshot:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - screenshot
          description: |-
            Specifies the event type. For a screenshot action, this property is 
            always set to `screenshot`.
      allOf:
        - $ref: '#/components/schemas/OpenAI.ComputerAction'
      description: A screenshot action.
    OpenAI.ComputerActionScroll:
      type: object
      required:
        - type
        - x
        - 'y'
        - scroll_x
        - scroll_y
      properties:
        type:
          type: string
          enum:
            - scroll
          description: |-
            Specifies the event type. For a scroll action, this property is 
