    AzureCosmosDBChatDataSource:
      type: object
      required:
        - type
        - parameters
      properties:
        type:
          type: string
          enum:
            - azure_cosmos_db
          description: The discriminated type identifier, which is always 'azure_cosmos_db'.
        parameters:
          type: object
          properties:
            top_n_documents:
              type: integer
              format: int32
              description: The configured number of documents to feature in the query.
            in_scope:
              type: boolean
              description: Whether queries should be restricted to use of the indexed data.
            strictness:
              type: integer
              format: int32
              minimum: 1
              maximum: 5
              description: |-
                The configured strictness of the search relevance filtering.
                Higher strictness will increase precision but lower recall of the answer.
            max_search_queries:
              type: integer
              format: int32
              description: |-
                The maximum number of rewritten queries that should be sent to the search provider for a single user message.
                By default, the system will make an automatic determination.
            allow_partial_result:
              type: boolean
              description: |-
                If set to true, the system will allow partial search results to be used and the request will fail if all
                partial queries fail. If not specified or specified as false, the request will fail if any search query fails.
              default: false
            include_contexts:
              type: array
              items:
                type: string
                enum:
                  - citations
                  - intent
                  - all_retrieved_documents
              maxItems: 3
              description: |-
                The output context properties to include on the response.
                By default, citations and intent will be requested.
              default:
                - citations
                - intent
            container_name:
              type: string
            database_name:
              type: string
            embedding_dependency:
              $ref: '#/components/schemas/AzureChatDataSourceVectorizationSource'
            index_name:
              type: string
            authentication:
              $ref: '#/components/schemas/AzureChatDataSourceConnectionStringAuthenticationOptions'
            fields_mapping:
              type: object
              properties:
                content_fields:
                  type: array
                  items:
                    type: string
                vector_fields:
                  type: array
                  items:
                    type: string
                title_field:
                  type: string
                url_field:
                  type: string
                filepath_field:
                  type: string
                content_fields_separator:
                  type: string
              required:
                - content_fields
                - vector_fields
          required:
            - container_name
            - database_name
            - embedding_dependency
            - index_name
            - authentication
            - fields_mapping
          description: The parameter information to control the use of the Azure CosmosDB data source.
      allOf:
        - $ref: '#/components/schemas/AzureChatDataSource'
      description: Represents a data source configuration that will use an Azure CosmosDB resource.
    AzureCreateChatCompletionRequest:
      type: object
      required:
        - messages
      properties:
        metadata:
          type: object
          additionalProperties:
            type: string
          description: |-
            Set of 16 key-value pairs that can be attached to an object. This can be
            useful for storing additional information about the object in a structured
            format, and querying for objects via API or the dashboard.

            Keys are strings with a maximum length of 64 characters. Values are strings
            with a maximum length of 512 characters.
          x-oaiTypeLabel: map
        temperature:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 2
          description: |-
            What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.
            We generally recommend altering this or `top_p` but not both.
          default: 1
        top_p:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: |-
            An alternative to sampling with temperature, called nucleus sampling,
            where the model considers the results of the tokens with top_p probability
            mass. So 0.1 means only the tokens comprising the top 10% probability mass
            are considered.

            We generally recommend altering this or `temperature` but not both.
          default: 1
        user:
          type: string
          description: |-
            A unique identifier representing your end-user, which can help OpenAI to
            monitor and detect abuse.
        messages:
          type: array
          items:
            $ref: '#/components/schemas/OpenAI.ChatCompletionRequestMessage'
          minItems: 1
          description: |-
            A list of messages comprising the conversation so far. Depending on the
            model you use, different message types (modalities) are supported,
            like text, images, and audio.
        modalities:
          type: object
          allOf:
            - $ref: '#/components/schemas/ResponseModalities'
          nullable: true
        reasoning_effort:
          allOf:
            - $ref: '#/components/schemas/OpenAI.ReasoningEffort'
          nullable: true
          default: medium
        max_completion_tokens:
          type: integer
          format: int32
          nullable: true
          description: |-
            An upper bound for the number of tokens that can be generated for a
            completion, including visible output tokens and reasoning tokens.
        frequency_penalty:
          type: number
          format: float
          nullable: true
          minimum: -2
          maximum: 2
          description: |-
            Number between -2.0 and 2.0. Positive values penalize new tokens based on
            their existing frequency in the text so far, decreasing the model's
            likelihood to repeat the same line verbatim.
          default: 0
        presence_penalty:
          type: number
          format: float
          nullable: true
          minimum: -2
          maximum: 2
          description: |-
            Number between -2.0 and 2.0. Positive values penalize new tokens based on
            whether they appear in the text so far, increasing the model's likelihood
            to talk about new topics.
          default: 0
        web_search_options:
          type: object
          properties:
            user_location:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - approximate
                  description: The type of location approximation. Always `approximate`.
                approximate:
                  $ref: '#/components/schemas/OpenAI.WebSearchLocation'
              required:
                - type
                - approximate
              nullable: true
              description: Approximate location parameters for the search.
            search_context_size:
              allOf:
                - $ref: '#/components/schemas/OpenAI.WebSearchContextSize'
              default: medium
          description: This tool searches the web for relevant results to use in a response.
        top_logprobs:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          maximum: 20
          description: |-
            An integer between 0 and 20 specifying the number of most likely tokens to
            return at each token position, each with an associated log probability.
            `logprobs` must be set to `true` if this parameter is used.
        response_format:
          allOf:
            - $ref: '#/components/schemas/OpenAI.ResponseFormat'
          description: |-
            An object specifying the format that the model must output.

            Setting to `{ "type": "json_schema", "json_schema": {...} }` enables
            Structured Outputs which ensures the model will match your supplied JSON
            schema.

            Setting to `{ "type": "json_object" }` enables JSON mode, which ensures
            the message the model generates is valid JSON.

            **Important:** when using JSON mode, you **must** also instruct the model
            to produce JSON yourself via a system or user message. Without this, the
            model may generate an unending stream of whitespace until the generation
            reaches the token limit, resulting in a long-running and seemingly "stuck"
            request. Also note that the message content may be partially cut off if
            `finish_reason="length"`, which indicates the generation exceeded
            `max_tokens` or the conversation exceeded the max context length.
          x-oaiExpandable: true
        audio:
          type: object
          properties:
            voice:
              allOf:
                - $ref: '#/components/schemas/OpenAI.VoiceIdsShared'
              description: |-
                The voice the model uses to respond. Supported voices are 
                `alloy`, `ash`, `ballad`, `coral`, `echo`, `sage`, and `shimmer`.
            format:
              type: string
              enum:
                - wav
                - mp3
                - flac
                - opus
                - pcm16
              description: |-
                Specifies the output audio format. Must be one of `wav`, `mp3`, `flac`,
                `opus`, or `pcm16`.
          required:
            - voice
            - format
          nullable: true
          description: |-
            Parameters for audio output. Required when audio output is requested with
            `modalities: ["audio"]`.
          x-oaiExpandable: true
        store:
          type: boolean
          nullable: true
          description: |-
            Whether or not to store the output of this chat completion request for
            use in model distillation or evals products.
          default: false
        stream:
          type: boolean
          nullable: true
          description: |-
            If set to true, the model response data will be streamed to the client
            as it is generated using server-sent events.
          default: false
        stop:
          allOf:
            - $ref: '#/components/schemas/OpenAI.StopConfiguration'
          nullable: true
          default: null
        logit_bias:
          type: object
          additionalProperties:
            type: integer
            format: int32
          nullable: true
          description: |-
            Modify the likelihood of specified tokens appearing in the completion.

            Accepts a JSON object that maps tokens (specified by their token ID in the
            tokenizer) to an associated bias value from -100 to 100. Mathematically,
            the bias is added to the logits generated by the model prior to sampling.
            The exact effect will vary per model, but values between -1 and 1 should
            decrease or increase likelihood of selection; values like -100 or 100
            should result in a ban or exclusive selection of the relevant token.
          x-oaiTypeLabel: map
          default: null
        logprobs:
          type: boolean
          nullable: true
          description: |-
            Whether to return log probabilities of the output tokens or not. If true,
            returns the log probabilities of each output token returned in the
            `content` of `message`.
          default: false
        max_tokens:
          type: integer
          format: int32
          nullable: true
          description: |-
            The maximum number of tokens that can be generated in the chat completion.
            This value can be used to control costs for text generated via API.

            This value is now deprecated in favor of `max_completion_tokens`, and is
            not compatible with o1 series models.
          deprecated: true
        'n':
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 128
          description: How many chat completion choices to generate for each input message. Note that you will be charged based on the number of generated tokens across all of the choices. Keep `n` as `1` to minimize costs.
          default: 1
        prediction:
          type: object
          allOf:
            - $ref: '#/components/schemas/OpenAI.ChatOutputPrediction'
          nullable: true
          description: |-
            Configuration for a predicted output, which can greatly improve
            response times when large parts of the model response are known
            ahead of time. This is most common when you are regenerating a
            file with only minor changes to most of the content.
          x-oaiExpandable: true
        seed:
          type: integer
          format: int64
          nullable: true
          description: |-
            This feature is in Beta.
            If specified, our system will make a best effort to sample deterministically, such that repeated requests with the same `seed` and parameters should return the same result.
            Determinism is not guaranteed, and you should refer to the `system_fingerprint` response parameter to monitor changes in the backend.
        stream_options:
          type: object
          allOf:
            - $ref: '#/components/schemas/OpenAI.ChatCompletionStreamOptions'
          nullable: true
          default: null
        tools:
          type: array
          items:
            $ref: '#/components/schemas/OpenAI.ChatCompletionTool'
          description: A list of tools the model may call. Currently, only functions are supported as a tool. Use this to provide a list of functions the model may generate JSON inputs for. A max of 128 functions are supported.
        tool_choice:
          $ref: '#/components/schemas/OpenAI.ChatCompletionToolChoiceOption'
        parallel_tool_calls:
          allOf:
            - $ref: '#/components/schemas/OpenAI.ParallelToolCalls'
          default: true
        function_call:
          anyOf:
            - type: string
              enum:
                - none
                - auto
            - $ref: '#/components/schemas/OpenAI.ChatCompletionFunctionCallOption'
          description: |-
            Deprecated in favor of `tool_choice`.

            Controls which (if any) function is called by the model.

            `none` means the model will not call a function and instead generates a
            message.

            `auto` means the model can pick between generating a message or calling a
            function.

            Specifying a particular function via `{"name": "my_function"}` forces the
            model to call that function.

            `none` is the default when no functions are present. `auto` is the default
            if functions are present.
          deprecated: true
          x-oaiExpandable: true
        functions:
          type: array
          items:
            $ref: '#/components/schemas/OpenAI.ChatCompletionFunctions'
          minItems: 1
          maxItems: 128
          description: |-
            Deprecated in favor of `tools`.

            A list of functions the model may generate JSON inputs for.
          deprecated: true
        data_sources:
          type: array
          items:
            $ref: '#/components/schemas/AzureChatDataSource'
          description: The data sources to use for the On Your Data feature, exclusive to Azure OpenAI.
        user_security_context:
          $ref: '#/components/schemas/AzureUserSecurityContext'
      description: |-
        The extended request model for chat completions against the Azure OpenAI service.
        This adds the ability to provide data sources for the On Your Data feature.
    AzureCreateChatCompletionResponse:
      type: object
      required:
        - id
        - choices
        - created
        - model
        - object
      properties:
        id:
          type: string
          description: A unique identifier for the chat completion.
        choices:
          type: array
          items:
            type: object
            properties:
              finish_reason:
                type: string
                enum:
                  - stop
                  - length
                  - tool_calls
                  - content_filter
                  - function_call
                description: |-
                  The reason the model stopped generating tokens. This will be `stop` if the model hit a natural stop point or a provided stop sequence,
                  `length` if the maximum number of tokens specified in the request was reached,
                  `content_filter` if content was omitted due to a flag from our content filters,
                  `tool_calls` if the model called a tool, or `function_call` (deprecated) if the model called a function.
              index:
                type: integer
                format: int32
                description: The index of the choice in the list of choices.
              message:
                $ref: '#/components/schemas/OpenAI.ChatCompletionResponseMessage'
              logprobs:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpenAI.ChatCompletionTokenLogprob'
                    nullable: true
                    description: A list of message content tokens with log probability information.
                    readOnly: true
                  refusal:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpenAI.ChatCompletionTokenLogprob'
                    nullable: true
                    description: A list of message refusal tokens with log probability information.
                    readOnly: true
                required:
                  - content
                  - refusal
                nullable: true
                description: Log probability information for the choice.
            required:
              - finish_reason
              - index
              - message
              - logprobs
          description: A list of chat completion choices. Can be more than one if `n` is greater than 1.
        created:
          type: integer
          format: unixtime
          description: The Unix timestamp (in seconds) of when the chat completion was created.
        model:
          type: string
          description: The model used for the chat completion.
        service_tier:
          type: string
          enum:
            - scale
            - default
          nullable: true
          description: The service tier used for processing the request.
        system_fingerprint:
          type: string
          description: |-
            This fingerprint represents the backend configuration that the model runs with.

            Can be used in conjunction with the `seed` request parameter to understand when backend changes have been made that might impact determinism.
        object:
          type: string
          enum:
            - chat.completion
          description: The object type, which is always `chat.completion`.
        usage:
          $ref: '#/components/schemas/OpenAI.CompletionUsage'
        prompt_filter_results:
          type: array
          items:
            type: object
            properties:
              prompt_index:
                type: integer
                format: int32
                description: The index of the input prompt that this content filter result corresponds to.
              content_filter_results:
                allOf:
                  - $ref: '#/components/schemas/AzureContentFilterResultForPrompt'
                description: The content filter results associated with the indexed input prompt.
            required:
              - prompt_index
              - content_filter_results
          description: The Responsible AI content filter annotations associated with prompt inputs into chat completions.
      description: |-
        The extended top-level chat completion response model for the Azure OpenAI service.
        This model adds Responsible AI content filter annotations for prompt input.
    AzureCreateCompletionRequest:
      type: object
      properties:
        prompt:
          nullable: true
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: |-
            The prompt(s) to generate completions for, encoded as a string, array of strings, array of tokens, or array of token arrays.
            Note that <|endoftext|> is the document separator that the model sees during training, so if a prompt is not specified the model will generate as if from the beginning of a new document.
          default: <|endoftext|>
        best_of:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          maximum: 20
          description: |-
            Generates `best_of` completions server-side and returns the "best" (the one with the highest log probability per token). Results cannot be streamed.

            When used with `n`, `best_of` controls the number of candidate completions and `n` specifies how many to return – `best_of` must be greater than `n`.

            **Note:** Because this parameter generates many completions, it can quickly consume your token quota. Use carefully and ensure that you have reasonable settings for `max_tokens` and `stop`.
          default: 1
        echo:
          type: boolean
          nullable: true
          description: Echo back the prompt in addition to the completion
          default: false
        frequency_penalty:
          type: number
          format: float
          nullable: true
          minimum: -2
          maximum: 2
          description: |-
            Number between -2.0 and 2.0. Positive values penalize new tokens based on
            their existing frequency in the text so far, decreasing the model's
            likelihood to repeat the same line verbatim.
          default: 0
        logit_bias:
          type: object
          additionalProperties:
            type: integer
            format: int32
          nullable: true
          description: |-
            Modify the likelihood of specified tokens appearing in the completion.

            Accepts a JSON object that maps tokens (specified by their token ID in the GPT tokenizer) to an associated bias value from -100 to 100. You can use this [tokenizer tool](/tokenizer?view=bpe) to convert text to token IDs. Mathematically, the bias is added to the logits generated by the model prior to sampling. The exact effect will vary per model, but values between -1 and 1 should decrease or increase likelihood of selection; values like -100 or 100 should result in a ban or exclusive selection of the relevant token.

            As an example, you can pass `{"50256": -100}` to prevent the <|endoftext|> token from being generated.
          x-oaiTypeLabel: map
          default: null
        logprobs:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          maximum: 5
          description: |-
            Include the log probabilities on the `logprobs` most likely output tokens, as well the chosen tokens. For example, if `logprobs` is 5, the API will return a list of the 5 most likely tokens. The API will always return the `logprob` of the sampled token, so there may be up to `logprobs+1` elements in the response.

            The maximum value for `logprobs` is 5.
          default: null
        max_tokens:
          type: integer
          format: int32
          nullable: true
          minimum: 0
          description: |-
            The maximum number of [tokens](/tokenizer) that can be generated in the completion.

            The token count of your prompt plus `max_tokens` cannot exceed the model's context length. [Example Python code](https://cookbook.openai.com/examples/how_to_count_tokens_with_tiktoken) for counting tokens.
          default: 16
        'n':
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 128
          description: |-
            How many completions to generate for each prompt.

            **Note:** Because this parameter generates many completions, it can quickly consume your token quota. Use carefully and ensure that you have reasonable settings for `max_tokens` and `stop`.
          default: 1
        presence_penalty:
          type: number
          format: float
          nullable: true
          minimum: -2
          maximum: 2
          description: |-
            Number between -2.0 and 2.0. Positive values penalize new tokens based on
            whether they appear in the text so far, increasing the model's likelihood
            to talk about new topics.
          default: 0
        seed:
          type: integer
          format: int64
          nullable: true
          description: |-
            If specified, our system will make a best effort to sample deterministically, such that repeated requests with the same `seed` and parameters should return the same result.

            Determinism is not guaranteed, and you should refer to the `system_fingerprint` response parameter to monitor changes in the backend.
        stop:
          allOf:
            - $ref: '#/components/schemas/OpenAI.StopConfiguration'
          nullable: true
          default: null
        stream:
          type: boolean
          nullable: true
          description: 'Whether to stream back partial progress. If set, tokens will be sent as data-only [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format) as they become available, with the stream terminated by a `data: [DONE]` message. [Example Python code](https://cookbook.openai.com/examples/how_to_stream_completions).'
          default: false
        stream_options:
          type: object
          allOf:
            - $ref: '#/components/schemas/OpenAI.ChatCompletionStreamOptions'
          nullable: true
          default: null
        suffix:
          type: string
          nullable: true
          description: |-
            The suffix that comes after a completion of inserted text.

            This parameter is only supported for `gpt-3.5-turbo-instruct`.
          default: null
        temperature:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 2
          description: |-
            What sampling temperature to use, between 0 and 2. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic.

            We generally recommend altering this or `top_p` but not both.
          default: 1
        top_p:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 1
          description: |-
            An alternative to sampling with temperature, called nucleus sampling, where the model considers the results of the tokens with top_p probability mass. So 0.1 means only the tokens comprising the top 10% probability mass are considered.

            We generally recommend altering this or `temperature` but not both.
          default: 1
        user:
          type: string
          description: |-
            A unique identifier representing your end-user, which can help OpenAI
            to monitor and detect abuse.
    AzureCreateCompletionResponse:
      type: object
      required:
        - id
        - created
        - model
        - object
        - choices
      properties:
        id:
          type: string
          description: A unique identifier for the completion.
        created:
          type: integer
          format: unixtime
          description: The Unix timestamp (in seconds) of when the completion was created.
        model:
          type: string
          description: The model used for completion.
        system_fingerprint:
          type: string
          description: |-
            This fingerprint represents the backend configuration that the model runs with.

            Can be used in conjunction with the `seed` request parameter to understand when backend changes have been made that might impact determinism.
        object:
          type: string
          enum:
            - text_completion
          description: The object type, which is always "text_completion"
        usage:
          $ref: '#/components/schemas/OpenAI.CompletionUsage'
        choices:
          type: array
          items:
            $ref: '#/components/schemas/CompletionChoice'
          description: The list of completion choices the model generated for the input prompt.
        prompt_filter_results:
          type: array
          items:
            $ref: '#/components/schemas/AzureContentFilterResultForPrompt'
      description: 'Represents a completion response from the API. Note: both the streamed and non-streamed response objects share the same shape (unlike the chat endpoint).'
    AzureCreateFileRequestMultiPart:
      type: object
      required:
        - file
        - purpose
        - expires_after
      properties:
        file:
          type: string
          format: binary
        purpose:
          type: string
          enum:
            - assistants
            - batch
            - fine-tune
            - vision
            - user_data
            - evals
          description: 'The intended purpose of the uploaded file. One of: - `assistants`: Used in the Assistants API - `batch`: Used in the Batch API - `fine-tune`: Used for fine-tuning - `vision`: Images used for vision fine-tuning - `user_data`: Flexible file type for any purpose - `evals`: Used for eval data sets'
        expires_after:
          type: object
          properties:
            seconds:
              type: integer
              format: int32
            anchor:
              $ref: '#/components/schemas/AzureFileExpiryAnchor'
          required:
            - seconds
            - anchor
    AzureCreateSpeechRequestMultiPart:
      type: object
      required:
        - input
        - voice
      properties:
        input:
          type: string
          maxLength: 4096
          description: The text to generate audio for. The maximum length is 4096 characters.
        instructions:
          type: string
          maxLength: 4096
          description: Control the voice of your generated audio with additional instructions. Does not work with `tts-1` or `tts-1-hd`.
        voice:
          allOf:
            - $ref: '#/components/schemas/OpenAI.VoiceIdsShared'
          description: |-
            The voice to use when generating the audio. Supported voices are `alloy`,
            `ash`, `coral`, `echo`, `fable`, `onyx`, `nova`, `sage` and `shimmer`.
        response_format:
          allOf:
            - $ref: '#/components/schemas/SpeechGenerationResponseFormat'
          description: The audio output format for the spoken text. By default, the MP3 format will be used.
        speed:
          type: number
          format: float
          minimum: 0.25
          maximum: 4
          description: The speed of speech for generated audio. Values are valid in the range from 0.25 to 4.0, with 1.0 the default and higher values corresponding to faster speech.
          default: 1
        model:
          type: string
          description: The model to use for this text-to-speech request.
      description: A representation of the request options that control the behavior of a text-to-speech operation.
    AzureCreateTranscriptionRequestMultiPart:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
        language:
          type: string
          description: The language of the input audio. Supplying the input language in [ISO-639-1](https://en.wikipedia.org/wiki/List_of_ISO_639-1_codes) (e.g. `en`) format will improve accuracy and latency.
        prompt:
          type: string
          description: |-
            An optional text to guide the model's style or continue a previous audio segment.
            The prompt should match the audio language.
        response_format:
          allOf:
            - $ref: '#/components/schemas/OpenAI.TranscriptionAudioResponseFormat'
          default: json
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: The sampling temperature, between 0 and 1. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic. If set to 0, the model will use [log probability](https://en.wikipedia.org/wiki/Log_probability) to automatically increase the temperature until certain thresholds are hit.
          default: 0
        include[]:
          type: array
          items:
            $ref: '#/components/schemas/OpenAI.TranscriptionInclude'
          description: |-
            Additional information to include in the transcription response. 
            `logprobs` will return the log probabilities of the tokens in the 
            response to understand the model's confidence in the transcription. 
            `logprobs` only works with response_format set to `json` and only with 
            the models `gpt-4o-transcribe` and `gpt-4o-mini-transcribe`.
        timestamp_granularities[]:
          type: array
          items:
            type: string
            enum:
              - word
              - segment
          description: 'The timestamp granularities to populate for this transcription. `response_format` must be set `verbose_json` to use timestamp granularities. Either or both of these options are supported: `word`, or `segment`. Note: There is no additional latency for segment timestamps, but generating word timestamps incurs additional latency.'
          default:
            - segment
        stream:
          type: boolean
          nullable: true
          description: |-
            If set to true, the model response data will be streamed to the client
            as it is generated using [server-sent events](https://developer.mozilla.org/en-US/docs/Web/API/Server-sent_events/Using_server-sent_events#Event_stream_format). 
            See the [Streaming section of the Speech-to-Text guide](/docs/guides/speech-to-text?lang=curl#streaming-transcriptions)
            for more information.

            Note: Streaming is not supported for the `whisper-1` model and will be ignored.
          default: false
        filename:
          type: string
          description: The optional filename or descriptive identifier to associate with with the audio data.
        model:
          type: string
          description: The model to use for this transcription request.
      description: The configuration information for an audio transcription request.
    AzureCreateTranslationRequestMultiPart:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
        prompt:
          type: string
          description: |-
            An optional text to guide the model's style or continue a previous audio segment.
            The prompt should be in English.
        response_format:
          allOf:
            - $ref: '#/components/schemas/OpenAI.TranslationAudioResponseFormat'
          description: 'The format of the output, in one of these options: `json`, `text`, `srt`, `verbose_json`, or `vtt`.'
          default: json
        temperature:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: The sampling temperature, between 0 and 1. Higher values like 0.8 will make the output more random, while lower values like 0.2 will make it more focused and deterministic. If set to 0, the model will use [log probability](https://en.wikipedia.org/wiki/Log_probability) to automatically increase the temperature until certain thresholds are hit.
          default: 0
        filename:
          type: string
          description: The optional filename or descriptive identifier to associate with with the audio data
        model:
          type: string
          description: The model to use for this translation request.
      description: The configuration information for an audio transcription request.
